# Expression Language "Task Parameter Types": Task.RawParam.<name> of a PATH task
# parameter is a string, so the path property `name` is not available on it.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Out
      type: PATH
      range:
      - /renders/shot01
  script:
    actions:
      onRun:
        command: echo
        args:
        - "{{ Task.RawParam.Out.name }}"
