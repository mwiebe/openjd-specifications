# Expression Language "Symbol Types": Task.Param.<name> of a PATH task
# parameter is a path, so the path property `name` is available on it.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Out
      type: PATH
      range:
      - /renders/shot01
  script:
    actions:
      onRun:
        command: echo
        args:
        - "{{ Task.Param.Out.name }}"
