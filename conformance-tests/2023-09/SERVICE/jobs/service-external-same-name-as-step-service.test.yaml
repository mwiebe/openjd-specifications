# Template Schemas §1.2.2 item 2: Service names are scoped to their document,
# and that includes every Step's stepServices — a Step Service named like an
# external Service is accepted, and the Step's Task reaches its own Step's
# Cache through Service.Cache.*.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ExternalSameNameAsStepService
  steps:
  - name: Use
    stepServices:
    - name: Cache
      ports:
      - name: main
      healthCheck:
        type: STDOUT
      script:
        actions:
          onRun:
            command: python
            args: ["-c", "import time; print('STEP_CACHE_UP', {{ Service.Cache.main.port }}, flush=True); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
            cancelation:
              mode: TERMINATE
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN', {{ Service.Cache.main.port }} > 0)"]

environments:
- specificationVersion: environment-2023-09
  extensions: [SERVICE, EXPR]
  services:
  - name: Cache
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('QUEUE_CACHE_UP', {{ Service.Cache.main.port }}, flush=True); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE

expected:
  output:
  - QUEUE_CACHE_UP
  - STEP_CACHE_UP
  - TASK_RAN True
