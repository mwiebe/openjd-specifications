# RFC 0009 lifecycle constraint 6 (a Service Session ends when the Service's
# scope completes) and "Service lifecycle" (a Job Service's scope is the whole
# Job), How Jobs Are Run § Services, Template Schemas §1.1 jobServices: a
# coordinator Job Service holds state written by one Step's Tasks and read by
# a dependent Step's Task, so the same instance must persist across Steps --
# including a later Step that never touches it -- and is stopped only once
# the Job completes. onExit runs once, after the last Step.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: JobServiceStatePersistsAcrossSteps
  jobServices:
  - name: Coord
    ports:
    - name: main
    healthCheck:
      type: STDOUT
      readinessTimeoutSeconds: 60
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Coord.main.bindAddress }}", "{{ Service.Coord.main.port }}"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('COORD_EXIT')"]
      embeddedFiles:
      - name: Serve
        type: TEXT
        data: |
          import socket, sys
          host, port = sys.argv[1], int(sys.argv[2])
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind((host, port))
          s.listen(16)
          store = []
          print("openjd_service_ready: coord up", flush=True)
          while True:
              c, _ = s.accept()
              msg = c.recv(256).decode()
              if msg.startswith("PUT "):
                  store.append(msg[4:])
                  c.sendall(b"OK")
              elif msg == "ALL":
                  c.sendall(",".join(sorted(store)).encode())
              c.close()
  steps:
  - name: Scatter
    parameterSpace:
      taskParameterDefinitions:
      - name: N
        type: INT
        range: "1-3"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import socket,sys; c=socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=10); c.sendall(b'PUT part' + sys.argv[3].encode()); print('SCATTER', sys.argv[3], c.recv(64).decode(), flush=True)", "{{ Service.Coord.main.connectAddress }}", "{{ Service.Coord.main.port }}", "{{ Task.Param.N }}"]
  - name: Gather
    dependencies:
    - dependsOn: Scatter
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import socket,sys; c=socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=10); c.sendall(b'ALL'); print('GATHERED', c.recv(256).decode(), flush=True)", "{{ Service.Coord.main.connectAddress }}", "{{ Service.Coord.main.port }}"]
  - name: Unrelated
    dependencies:
    - dependsOn: Gather
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('UNRELATED_RAN')"]

expected:
  output:
  - SCATTER 1 OK
  - SCATTER 2 OK
  - SCATTER 3 OK
  - GATHERED part1,part2,part3
  - UNRELATED_RAN
  - COORD_EXIT
