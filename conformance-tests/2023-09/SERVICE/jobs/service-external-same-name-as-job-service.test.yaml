# Template Schemas §1.2.2 item 2: Service names are scoped to the document
# that declares them. An external Service named like a Service in the Job
# Template's jobServices is accepted — the submission is not rejected for a
# shared name — and the two run as distinct Services, each reached only by
# the entities of its own document: the Task's Service.Store.* is the Job
# Template's Store. Both must start before the Task runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ExternalSameNameAsJobService
  jobServices:
  - name: Store
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('JOB_STORE_UP', {{ Service.Store.main.port }}, flush=True); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN', {{ Service.Store.main.port }} > 0)"]

environments:
- specificationVersion: environment-2023-09
  extensions: [SERVICE, EXPR]
  services:
  - name: Store
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('QUEUE_STORE_UP', {{ Service.Store.main.port }}, flush=True); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE

expected:
  output:
  - JOB_STORE_UP
  - QUEUE_STORE_UP
  - TASK_RAN True
