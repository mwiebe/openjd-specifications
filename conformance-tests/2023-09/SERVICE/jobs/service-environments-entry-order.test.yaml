# RFC 0009 §9 item 5 / "Services run inside Environments": a Service Session
# enters the Service's `serviceEnvironments`, in order, after the Environments
# of its scope and before the Service's onEnter, and exits them in reverse
# after its onExit. Each action appends a word to a trace file in the Service
# Session's working directory; the last Service Environment's onExit (the last
# to run) prints the whole trace on one line. The Task Session enters the Job
# Environment but never a Service Environment.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ServiceEnvironmentsEntryOrder
  jobEnvironments:
  - name: JobEnv
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "open('trace.txt', 'a').write('job-env-enter ')"]
        onExit:
          command: python
          args: ["-c", "open('trace.txt', 'a').write('job-env-exit ')"]
  jobServices:
  - name: Store
    serviceEnvironments:
    - name: First
      script:
        actions:
          onEnter:
            command: python
            args: ["-c", "open('trace.txt', 'a').write('first-enter ')"]
          onExit:
            command: python
            args: ["-c", "open('trace.txt', 'a').write('first-exit '); print('SERVICE_TRACE', open('trace.txt').read().strip())"]
    - name: Second
      script:
        actions:
          onEnter:
            command: python
            args: ["-c", "open('trace.txt', 'a').write('second-enter ')"]
          onExit:
            command: python
            args: ["-c", "open('trace.txt', 'a').write('second-exit ')"]
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "open('trace.txt', 'a').write('service-enter ')"]
        onRun:
          command: python
          args: ["-c", "import time; open('trace.txt', 'a').write('service-run '); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "open('trace.txt', 'a').write('service-exit ')"]
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; print('TASK_TRACE', open('trace.txt').read().strip() if os.path.exists('trace.txt') else 'none'); print('TASK_PORT_OK', {{ Service.Store.main.port }} > 0)"]

expected:
  output:
  - "SERVICE_TRACE job-env-enter first-enter second-enter service-enter service-run service-exit second-exit first-exit"
  - "TASK_TRACE job-env-enter"
  - TASK_PORT_OK True
  forbidden:
  - "TASK_TRACE job-env-enter first-enter"
