# Template Schemas §1.2 / §1.2.2: an Environment Template with `services` and
# no `environment` supplies an external Service to a Job that neither
# declares SERVICE nor references the Service. The external Service is
# started before the Job's Tasks (they are gated on it being READY), and its
# Session is ended -- onExit runs -- once the Job's Tasks are done.
template:
  specificationVersion: jobtemplate-2023-09
  name: ServicesOnlyAttachment
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN')"]

environments:
- specificationVersion: environment-2023-09
  extensions: [SERVICE, EXPR]
  services:
  - name: Telemetry
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('TELEMETRY_RUNNING', flush=True); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('TELEMETRY_EXIT')"]

expected:
  output:
  - TELEMETRY_RUNNING
  - TASK_RAN
  - TELEMETRY_EXIT
