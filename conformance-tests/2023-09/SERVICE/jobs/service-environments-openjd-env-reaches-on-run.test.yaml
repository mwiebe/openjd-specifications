# RFC 0009 §9 item 5 / "Services run inside Environments": a Service
# Environment's `variables` and `openjd_env` exports reach the Service's
# onEnter, onRun, and onExit; a later Service Environment takes precedence
# over an earlier one and over the scope's Environments; the Service's own
# `variables` take precedence over all of them; and the Task, whose Session
# never enters a Service Environment, sees none of it.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ServiceEnvironmentsOpenjdEnv
  jobEnvironments:
  - name: JobEnv
    variables:
      FROM_JOB_ENV: job-env
      LAYERED: job-env
  jobServices:
  - name: Store
    serviceEnvironments:
    - name: Provision
      variables:
        LAYERED: provision
        OVERRIDDEN_BY_SERVICE: provision
      script:
        actions:
          onEnter:
            command: python
            args: ["-c", "print('openjd_env: TOOL_HOME=' + r'{{ Session.WorkingDirectory }}' + '/tool', flush=True)"]
    - name: Tuning
      variables:
        LAYERED: tuning
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    variables:
      OVERRIDDEN_BY_SERVICE: service
    script:
      actions:
        onEnter:
          command: python
          args: ["{{ Service.File.Report }}", "SERVICE_ENTER"]
        onRun:
          command: python
          args: ["{{ Service.File.Report }}", "SERVICE_RUN"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["{{ Service.File.Report }}", "SERVICE_EXIT"]
      embeddedFiles:
      - name: Report
        type: TEXT
        data: |
          import os, sys, time
          who = sys.argv[1]
          print(who + "_TOOL_HOME_SET=" + str(os.environ.get("TOOL_HOME", "").endswith("/tool")), flush=True)
          print(who + "_LAYERED=" + os.environ.get("LAYERED", "unset"), flush=True)
          print(who + "_OVERRIDDEN_BY_SERVICE=" + os.environ.get("OVERRIDDEN_BY_SERVICE", "unset"), flush=True)
          print(who + "_FROM_JOB_ENV=" + os.environ.get("FROM_JOB_ENV", "unset"), flush=True)
          if who == "SERVICE_RUN":
              print("openjd_service_ready: reported", flush=True)
              time.sleep(600)
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; print('TASK_TOOL_HOME=' + os.environ.get('TOOL_HOME', 'unset')); print('TASK_LAYERED=' + os.environ.get('LAYERED', 'unset')); print('TASK_PORT_OK', {{ Service.Store.main.port }} > 0)"]

expected:
  output:
  - SERVICE_ENTER_TOOL_HOME_SET=True
  - SERVICE_ENTER_LAYERED=tuning
  - SERVICE_ENTER_OVERRIDDEN_BY_SERVICE=service
  - SERVICE_ENTER_FROM_JOB_ENV=job-env
  - SERVICE_RUN_TOOL_HOME_SET=True
  - SERVICE_RUN_LAYERED=tuning
  - SERVICE_RUN_OVERRIDDEN_BY_SERVICE=service
  - SERVICE_EXIT_TOOL_HOME_SET=True
  - SERVICE_EXIT_LAYERED=tuning
  - TASK_TOOL_HOME=unset
  - TASK_LAYERED=job-env
  - TASK_PORT_OK True
