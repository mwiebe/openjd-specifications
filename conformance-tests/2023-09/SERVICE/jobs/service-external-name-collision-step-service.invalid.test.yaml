# Template Schemas §1.2.2 item 2 (submission-time check): the collision rule
# also covers every Step's stepServices.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ExternalNameCollisionStep
  steps:
  - name: Use
    stepServices:
    - name: Cache
      ports:
      - name: main
      readinessCheck:
        type: STDOUT
      script:
        actions:
          onRun:
            command: python
            args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
            cancelation:
              mode: TERMINATE
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN')"]

environments:
- specificationVersion: environment-2023-09
  extensions: [SERVICE, EXPR]
  services:
  - name: Cache
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
