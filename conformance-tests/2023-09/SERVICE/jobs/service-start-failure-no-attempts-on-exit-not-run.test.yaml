# RFC 0009 lifecycle constraint 7 ("onExit runs if it is defined and any
# action of the Service has run") and "Failure and restart" (a start failure
# is "an Environment's onEnter fails" and, with no attempts left, step 4
# fails the scope): the onEnter of one of the Service's serviceEnvironments
# always fails, so no action of the Service itself -- onEnter, onRun -- ever
# runs. With the default maxAttempts of 0 the Service is FAILED, the Job
# fails before any Task runs, and the Service's onExit is NOT run because
# nothing of the Service ran (Template Schemas §9 item 5, §9.4, §9.6).
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: StartFailureNoAttemptsOnExitNotRun
  jobServices:
  - name: Store
    serviceEnvironments:
    - name: Provision
      script:
        actions:
          onEnter:
            command: python
            args: ["-c", "print('PROVISION_FAILING', flush=True); raise SystemExit(3)"]
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
      timeoutSeconds: 60
    restartPolicy:
      maxAttempts: 0
      completedTasks: KEEP
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('SVC_ENTER')"]
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('SVC_EXIT')"]
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN', {{ Service.Store.main.port }} > 0)"]

expected:
  taskFailure: {}
  output:
  - PROVISION_FAILING
  forbidden:
  - SVC_ENTER
  - SVC_EXIT
  - TASK_RAN
