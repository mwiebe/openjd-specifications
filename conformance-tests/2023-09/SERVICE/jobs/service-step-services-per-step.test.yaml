# Template Schemas §3 item 6 constraint 5 / §9 scope rule 4: two Steps each
# declare a Step Service named Coordinator. Each is a separate Service with
# its own endpoint, started for its Step and stopped when the Step completes,
# and each Step's Tasks reach their own Step's Service.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: StepServicesPerStep
  steps:
  - name: Alpha
    stepServices:
    - name: Coordinator
      ports:
      - name: api
      healthCheck:
        type: STDOUT
      script:
        actions:
          onRun:
            command: python
            args: ["{{ Service.File.Serve }}", "{{ Service.Coordinator.api.bindAddress }}", "{{ Service.Coordinator.api.port }}", "ALPHA"]
            cancelation:
              mode: TERMINATE
          onExit:
            command: python
            args: ["-c", "print('ALPHA_COORDINATOR_EXIT')"]
        embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import socket, sys
            host, port, tag = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            s.bind((host, port))
            s.listen(16)
            print("openjd_service_ready:", tag, flush=True)
            while True:
                c, _ = s.accept()
                c.sendall(tag.encode())
                c.close()
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import socket,sys; c=socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=10); print('ALPHA_TASK_GOT', c.recv(64).decode(), flush=True)", "{{ Service.Coordinator.api.connectAddress }}", "{{ Service.Coordinator.api.port }}"]
  - name: Beta
    dependencies:
    - dependsOn: Alpha
    stepServices:
    - name: Coordinator
      ports:
      - name: api
      healthCheck:
        type: STDOUT
      script:
        actions:
          onRun:
            command: python
            args: ["{{ Service.File.Serve }}", "{{ Service.Coordinator.api.bindAddress }}", "{{ Service.Coordinator.api.port }}", "BETA"]
            cancelation:
              mode: TERMINATE
        embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import socket, sys
            host, port, tag = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            s.bind((host, port))
            s.listen(16)
            print("openjd_service_ready:", tag, flush=True)
            while True:
                c, _ = s.accept()
                c.sendall(tag.encode())
                c.close()
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import socket,sys; c=socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=10); print('BETA_TASK_GOT', c.recv(64).decode(), flush=True)", "{{ Service.Coordinator.api.connectAddress }}", "{{ Service.Coordinator.api.port }}"]

expected:
  output:
  - ALPHA_TASK_GOT ALPHA
  - ALPHA_COORDINATOR_EXIT
  - BETA_TASK_GOT BETA
  forbidden:
  - ALPHA_TASK_GOT BETA
  - BETA_TASK_GOT ALPHA
