# RFC 0009 "Failure and restart" step 4 / Template Schemas §9.4: a Job
# Service whose onRun exits before becoming READY every time. After
# maxAttempts relaunches the Service is FAILED and its scope -- the Job --
# fails, so the run must exit non-zero.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: MaxAttemptsExhausted
  jobServices:
  - name: Broken
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
      timeoutSeconds: 30
    restartPolicy:
      maxAttempts: 2
      completedTasks: RERUN
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print(\"BROKEN_EXITING\", flush=True); raise SystemExit(3)"]
        onExit:
          command: python
          args: ["-c", "print(\"BROKEN_EXIT_RAN\")"]
  steps:
  - name: Never
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print(\"TASK_MUST_NOT_RUN\")"]
