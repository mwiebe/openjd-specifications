# Template Schemas §9.2 (RFC 0009) / Expression Language §1.3.2: a
# whole-field expression on `port` has target type int?. A STRING parameter
# is coerced at job creation; a value that is not an integer must be
# rejected there.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: PortFromStringParamNotInteger
  parameterDefinitions:
  - name: Port
    type: STRING
    default: "16379"
  jobServices:
  - name: Store
    ports:
    - name: main
      port: "{{ Param.Port }}"
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_MUST_NOT_RUN')"]

parameters:
  Port: redis
