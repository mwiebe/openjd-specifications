# RFC 0009 "Failure and restart" with completedTasks: KEEP (Template Schemas
# §9.4). The Service's first instance exits while Task 1 is still running
# (after answering it). Running Tasks continue -- Task 1 completes against
# instance 1 -- completed Tasks keep their results (Task 1 is not rerun), and
# Tasks not yet started wait for the relaunched instance to be READY.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: KeepRelaunch
  jobServices:
  - name: Flaky
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
      timeoutSeconds: 60
    restartPolicy:
      maxAttempts: 1
      completedTasks: KEEP
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Flaky.main.bindAddress }}", "{{ Service.Flaky.main.port }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
      - name: Serve
        type: TEXT
        data: |
          import os, socket, sys, threading, time
          host, port = sys.argv[1], int(sys.argv[2])
          # A relaunch of a READY instance stays in the same Service Session, so a
          # marker in the Session working directory tells the instances apart.
          marker = os.path.join(os.getcwd(), "relaunched.marker")
          instance = 2 if os.path.exists(marker) else 1
          open(marker, "a").close()
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind((host, port))
          s.listen(16)
          print("openjd_service_ready: instance", instance, flush=True)
          while True:
              c, _ = s.accept()
              msg = c.recv(64).decode()
              c.sendall(str(instance).encode())
              c.close()
              if instance == 1 and msg == "task 1":
                  # Exit shortly after Task 1 has its answer, while Task 1 is still
                  # running: an instance failure.
                  time.sleep(0.3)
                  print("INSTANCE 1 EXITING", flush=True)
                  sys.exit(1)
  steps:
  - name: Work
    parameterSpace:
      taskParameterDefinitions:
      - name: N
        type: INT
        range: "1-3"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Service.Flaky.main.connectAddress }}", "{{ Service.Flaky.main.port }}", "{{ Task.Param.N }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
      - name: Run
        type: TEXT
        data: |
          import socket, sys, time
          host, port, n = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          c = socket.create_connection((host, port), timeout=10)
          c.sendall(("task " + n).encode())
          instance = c.recv(64).decode()
          c.close()
          print("TASK", n, "GOT INSTANCE", instance, flush=True)
          time.sleep(1.5)
          print("TASK", n, "INSTANCE", instance, "DONE", flush=True)

expected:
  output:
  - TASK 1 GOT INSTANCE 1
  - INSTANCE 1 EXITING
  - TASK 1 INSTANCE 1 DONE
  - TASK 2 INSTANCE 2 DONE
  - TASK 3 INSTANCE 2 DONE
  forbidden:
  - TASK 1 GOT INSTANCE 2
  - TASK 2 GOT INSTANCE 1
