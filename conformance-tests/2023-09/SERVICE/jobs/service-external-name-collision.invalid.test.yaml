# Template Schemas §1.2.2 item 2 (submission-time check): the name of an
# external Service must not equal the name of any Service in the Job
# Template's jobServices. Neither document is invalid on its own, so only
# the scheduler combining them can reject the submission.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ExternalNameCollision
  jobServices:
  - name: Store
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print(\"openjd_service_ready: up\", flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print(\"TASK_RAN\", {{ Service.Store.main.port }} > 0)"]

environments:
- specificationVersion: environment-2023-09
  extensions: [SERVICE, EXPR]
  services:
  - name: Store
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
