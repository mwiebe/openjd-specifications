# RFC 0009 <ServiceReadinessCheck> item 4 (timeoutSeconds "runs continuously,
# including while an onReadinessCheck invocation is in progress. If exceeded,
# the instance is treated as failed"), "Concurrency with onRun" rule 5 (an
# invocation in progress when the Session ends is canceled before onExit),
# "Failure and restart" step 4, and lifecycle constraints 6-7 (Template
# Schemas §9.3, §9.6.1): a COMMAND check whose onReadinessCheck never
# finishes inside timeoutSeconds. With the default maxAttempts of 0 the
# Service becomes FAILED and fails the Job before any Task runs; the
# in-flight check is canceled (CHECK_FINISHED never prints) and onExit still
# runs because an action of the Service ran.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ReadinessTimeoutFailsScope
  jobServices:
  - name: Slow
    ports:
    - name: main
    readinessCheck:
      type: COMMAND
      intervalSeconds: 1
      timeoutSeconds: 2
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('SLOW_NEVER_READY', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onReadinessCheck:
          command: python
          args: ["-c", "import time; print('CHECK_STARTED', flush=True); time.sleep(60); print('CHECK_FINISHED', flush=True)"]
          timeout: 120
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('SLOW_EXIT_RAN')"]
  steps:
  - name: Never
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_MUST_NOT_RUN')"]

expected:
  taskFailure: {}
  output:
  - SLOW_NEVER_READY
  - CHECK_STARTED
  - SLOW_EXIT_RAN
  forbidden:
  - CHECK_FINISHED
  - TASK_MUST_NOT_RUN
