# RFC 0009 §9 item 5.2 / §4.3 constraint 6: a wrapping Service Environment
# (effective runScope [SERVICE]) wraps the one Service that declares it: its
# onWrapService* hooks run in place of the Service's actions with
# WrappedService.* and the Service's own bindAddress in scope, its
# onWrapEnvEnter / onWrapEnvExit wrap the Service Environment after it in the
# list, and nothing wraps the Task or the Job Environment in the Task Session.
# The hooks re-launch the wrapped command with python's subprocess module,
# forwarding stdout, so the wrapped onRun's openjd_service_ready is recognized.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR, WRAP_ACTIONS]
  name: WrappingServiceEnvironment
  jobEnvironments:
  - name: Tooling
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('TOOLING_ENTER')"]
  jobServices:
  - name: Store
    serviceEnvironments:
    - name: Container
      script:
        actions:
          onWrapEnvEnter:
            command: python
            args: ["{{ Env.File.Launch }}", "WRAP_ENV_ENTER={{ WrappedEnv.Name }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
          onWrapEnvExit:
            command: python
            args: ["{{ Env.File.Launch }}", "WRAP_ENV_EXIT={{ WrappedEnv.Name }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
          onWrapServiceEnter:
            command: python
            args: ["{{ Env.File.Launch }}", "WRAP_SERVICE_ENTER={{ WrappedService.Name }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
          onWrapServiceRun:
            command: python
            args: ["{{ Env.File.Launch }}", "WRAP_SERVICE_RUN={{ WrappedService.Name }} ports={{ repr_py(WrappedService.PortNames) }} count={{ len(WrappedService.Ports) }} bind_matches={{ WrappedService.BindAddresses[0] == Service.Store.main.bindAddress and WrappedService.Ports[0] == Service.Store.main.port }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
          onWrapServiceReadinessCheck:
            command: python
            args: ["{{ Env.File.Launch }}", "WRAP_SERVICE_CHECK", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
          onWrapServiceExit:
            command: python
            args: ["{{ Env.File.Launch }}", "WRAP_SERVICE_EXIT={{ WrappedService.Name }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
        embeddedFiles:
        - name: Launch
          type: TEXT
          data: |
            import ast, subprocess, sys
            marker, command, args = sys.argv[1], sys.argv[2], ast.literal_eval(sys.argv[3])
            print(marker, flush=True)
            sys.exit(subprocess.call([command, *args]))
    - name: Inner
      script:
        actions:
          onEnter:
            command: python
            args: ["-c", "print('INNER_ENTER')"]
          onExit:
            command: python
            args: ["-c", "print('INNER_EXIT')"]
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('SERVICE_ENTER_ORIGINAL')"]
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: wrapped up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('SERVICE_EXIT_ORIGINAL')"]
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN', {{ Service.Store.main.port }} > 0)"]

expected:
  output:
  - TOOLING_ENTER
  - WRAP_ENV_ENTER=Inner
  - INNER_ENTER
  - WRAP_SERVICE_ENTER=Store
  - SERVICE_ENTER_ORIGINAL
  - "WRAP_SERVICE_RUN=Store ports=['main'] count=1 bind_matches=true"
  - TASK_RAN True
  - WRAP_SERVICE_EXIT=Store
  - SERVICE_EXIT_ORIGINAL
  - WRAP_ENV_EXIT=Inner
  - INNER_EXIT
  forbidden:
  - WRAP_ENV_ENTER=Tooling
  - WRAP_ENV_EXIT=Tooling
  - WRAP_SERVICE_CHECK
