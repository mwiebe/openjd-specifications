# Template Schemas §9 item 3, §9.5 item 1, §3 (RFC 0009): a <Service>'s `let`
# (job creation: Param.*, Job.Name, and for a Step Service Step.Name and the
# Step's `let`) and a <ServiceScript>'s `let` (service execution: Session.*,
# Service.File.*, the Service's own endpoint) both resolve within the
# Service's actions and `variables`.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: LetBindingsResolve
  parameterDefinitions:
  - name: Workers
    type: INT
    default: 3
  steps:
  - name: Render
    let:
    - threads = Param.Workers * 2
    stepServices:
    - name: Coordinator
      let:
      - label = Job.Name + "/" + Step.Name + "/" + string(threads)
      ports:
      - name: api
      readinessCheck:
        type: STDOUT
      variables:
        COORD_LABEL: "{{ label }}"
      script:
        let:
        - endpoint = join_host_port(Service.Coordinator.api.connectAddress, Service.Coordinator.api.port)
        - conf = Service.File.Conf
        actions:
          onRun:
            command: python
            args: ["-c", "import os,time; print('LABEL', os.environ['COORD_LABEL']); print('ENDPOINT_HAS_PORT', '{{ endpoint }}'.endswith(':' + str({{ Service.Coordinator.api.port }}))); print('CONF_CONTENT', open(r'{{ conf }}').read().strip()); print('openjd_service_ready: let ok', flush=True); time.sleep(600)"]
            cancelation:
              mode: TERMINATE
        embeddedFiles:
        - name: Conf
          type: TEXT
          data: "threads={{ threads }}"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_THREADS', {{ threads }})"]

expected:
  output:
  - LABEL LetBindingsResolve/Render/6
  - ENDPOINT_HAS_PORT True
  - CONF_CONTENT threads=6
  - TASK_THREADS 6
