# Template Schemas §1.2.2 item 2 (submission-time check): two attached
# Environment Templates defining external Services with the same name
# collide with each other, even when the Job Template declares no Service.
template:
  specificationVersion: jobtemplate-2023-09
  name: TwoAttachmentsCollide
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN')"]

environments:
- specificationVersion: environment-2023-09
  extensions: [SERVICE, EXPR]
  services:
  - name: Cache
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
- specificationVersion: environment-2023-09
  extensions: [SERVICE, EXPR]
  services:
  - name: Cache
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
