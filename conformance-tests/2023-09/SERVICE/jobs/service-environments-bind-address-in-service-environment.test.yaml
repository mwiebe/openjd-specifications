# RFC 0009 §9 item 5 / §7.3.1 scope rule 1: a Service Environment has the
# declaring Service's own scope. Its onEnter receives the Service's
# bindAddress and port (and an earlier Service's connectAddress / port), its
# `let` composes a URL from them, its embedded file and `variables` resolve
# them too, and it hands the bind endpoint to onRun through openjd_env, which
# the service process then actually binds. The Task confirms the endpoint it
# sees matches what the Service Environment resolved.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ServiceEnvironmentBindAddress
  jobServices:
  - name: Back
    ports:
    - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: back up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  - name: Store
    serviceEnvironments:
    - name: Provision
      variables:
        STORE_BIND_FROM_VARIABLES: "{{ Service.Store.main.bindAddress }}:{{ Service.Store.main.port }}"
      script:
        let:
        - back_url = "tcp://" + join_host_port(Service.Back.main.connectAddress, Service.Back.main.port)
        actions:
          onEnter:
            command: python
            args: ["{{ Env.File.Provision }}", "{{ Service.Store.main.bindAddress }}", "{{ Service.Store.main.port }}", "{{ back_url }}", "{{ Service.Back.main.port }}"]
        embeddedFiles:
        - name: Provision
          type: TEXT
          data: |
            import os, sys
            bind, port, back_url, back_port = sys.argv[1:5]
            print("PROVISION_BACK_URL_OK", back_url == "tcp://" + "{{ Service.Back.main.connectAddress }}" + ":" + back_port, flush=True)
            print("PROVISION_FILE_BIND_OK", "{{ Service.Store.main.bindAddress }}" == bind, flush=True)
            print("PROVISION_VARIABLES_OK", os.environ["STORE_BIND_FROM_VARIABLES"] == bind + ":" + port, flush=True)
            print("openjd_env: STORE_BIND=" + bind, flush=True)
            print("openjd_env: STORE_PORT=" + port, flush=True)
    ports:
    - name: main
    readinessCheck:
      type: TCP_CONNECT
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
      - name: Serve
        type: TEXT
        data: |
          import os, socket
          host, port = os.environ["STORE_BIND"], int(os.environ["STORE_PORT"])
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind((host, port))
          s.listen(16)
          print("STORE_BOUND_FROM_SERVICE_ENVIRONMENT", flush=True)
          while True:
              c, _ = s.accept()
              # A TCP_CONNECT readiness probe connects and closes without
              # sending; recv may return b"" or raise on an abortive close.
              try:
                  data = c.recv(64)
              except OSError:
                  data = b""
              if data:
                  c.sendall(str(port).encode())
              c.close()
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import socket; c = socket.create_connection(('{{ Service.Store.main.connectAddress }}', {{ Service.Store.main.port }}), timeout=10); c.sendall(b'port?'); reply = c.recv(64).decode(); c.close(); print('TASK_PORT_MATCHES', reply == '{{ Service.Store.main.port }}')"]

expected:
  output:
  - PROVISION_BACK_URL_OK True
  - PROVISION_FILE_BIND_OK True
  - PROVISION_VARIABLES_OK True
  - STORE_BOUND_FROM_SERVICE_ENVIRONMENT
  - TASK_PORT_MATCHES True
