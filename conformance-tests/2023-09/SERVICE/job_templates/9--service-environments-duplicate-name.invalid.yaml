# Section 9 item 5.1 (RFC 0009): no two Environments in a Service's
# `serviceEnvironments` may have the same name.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  serviceEnvironments:
  - name: Conda
    variables:
      A: "1"
  - name: Conda
    variables:
      B: "1"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
