# Section 4.3 (RFC 0008 single wrap layer, RFC 0009): a Service Session's
# stack is the scope's Environments whose `runScope` includes SERVICE followed
# by the Service's `serviceEnvironments`; a SERVICE-scoped wrapping Job
# Environment plus a wrapping Service Environment is two layers in that
# Service's Session.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: OuterWrap
  runScope: [SERVICE]
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceReadinessCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
jobServices:
- name: Store
  serviceEnvironments:
  - name: Container
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args: ["-c", "print()"]
        onWrapEnvExit:
          command: python
          args: ["-c", "print()"]
        onWrapServiceEnter:
          command: python
          args: ["-c", "print()"]
        onWrapServiceRun:
          command: python
          args: ["-c", "print()"]
        onWrapServiceReadinessCheck:
          command: python
          args: ["-c", "print()"]
        onWrapServiceExit:
          command: python
          args: ["-c", "print()"]
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
