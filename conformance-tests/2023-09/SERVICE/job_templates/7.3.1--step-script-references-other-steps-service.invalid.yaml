# Section 3 item 6 / Section 9 scope rule 4: a Step Service is available only
# to the Step that declares it, not to other Steps -- including Steps that
# depend on the declaring Step.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
steps:
- name: Step1
  stepServices:
  - name: Coordinator
    ports:
    - name: main
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()", ]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Step2
  dependencies:
  - dependsOn: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Coordinator.main.port }}"]
