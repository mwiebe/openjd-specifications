# Section 9.2 (RFC 0009): the numeric @fmtstring fields -- <ServicePort>.port,
# <ServiceReadinessCheck>.timeoutSeconds and intervalSeconds, and
# <ServiceRestartPolicy>.maxAttempts -- may be format strings over Param.*,
# RawParam.*, Job.Name, and <Service>.let bindings, resolved at job creation.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
parameterDefinitions:
- name: Port
  type: INT
  default: 16379
- name: Patience
  type: INT
  default: 60
jobServices:
- name: Store
  let:
  - attempts = 1 if Param.Patience > 30 else 0
  ports:
  - name: main
    port: "{{ Param.Port }}"
  readinessCheck:
    type: COMMAND
    intervalSeconds: "{{ Param.Patience // 10 }}"
    timeoutSeconds: "{{ Param.Patience }}"
  restartPolicy:
    maxAttempts: "{{ attempts }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
      onReadinessCheck:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
