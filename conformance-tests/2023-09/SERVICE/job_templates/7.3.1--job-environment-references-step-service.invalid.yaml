# Section 9 scope rule 3 vs 4: a Job Environment (even TASK-scoped) is
# entered for every Step, so it cannot see any Step's Services; only a
# Step Service's own Step's stepEnvironments may reference it.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  runScope: [TASK]
  variables:
    COORD_PORT: "{{ Service.Coordinator.main.port }}"
steps:
- name: Step1
  stepServices:
  - name: Coordinator
    ports:
    - name: main
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()", ]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
