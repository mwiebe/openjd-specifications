# Section 9 item 4 constraint 3 / Section 9.1 rule 3 (RFC 0009): scope is
# transitive through referencing Services. Front references Indexer and
# Prepare references Front, so Prepare is in Indexer's scope; Indexer
# depending on Prepare is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Indexer
  dependencies:
  - dependsOn: Prepare
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Front
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Indexer.main.port }}"]
steps:
- name: Prepare
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Front.main.port }}"]
