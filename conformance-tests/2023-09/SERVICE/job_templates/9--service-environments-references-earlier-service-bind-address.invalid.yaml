# Section 9 item 5 / 7.3.1 (RFC 0009): a Service Environment sees an earlier
# Service's `port` and `connectAddress` only, not its `bindAddress`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Front
  serviceEnvironments:
  - name: Conda
    variables:
      BACK_BIND: "{{ Service.Back.main.bindAddress }}"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
