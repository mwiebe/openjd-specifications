# Section 9 item 5 / 7.3.1 scope rule 1 (RFC 0009): a Service Environment is
# entered only in the declaring Service's Session, after its ports are
# allocated, so it has the Service's own scope: all three endpoint values,
# including `bindAddress`, in `variables`, actions, its `let`, and embedded
# files.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  serviceEnvironments:
  - name: Conda
    variables:
      STORE_BIND: "{{ Service.Store.main.bindAddress }}"
      STORE_PORT: "{{ Service.Store.main.port }}"
    script:
      let:
      - url = "tcp://" + join_host_port(Service.Store.main.connectAddress, Service.Store.main.port)
      actions:
        onEnter:
          command: python
          args: ["{{ Env.File.Setup }}", "{{ url }}", "{{ Service.Store.main.bindAddress }}:{{ Service.Store.main.port }}"]
      embeddedFiles:
      - name: Setup
        type: TEXT
        data: "bind {{ Service.Store.main.bindAddress }}"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
