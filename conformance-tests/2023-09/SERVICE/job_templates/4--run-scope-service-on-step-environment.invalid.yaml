# Template Schemas §4 item 4 (runScope) constraint 4: the runScope of a
# stepEnvironments entry must not include SERVICE. A Step Environment is
# entered only by the Task Sessions of its Step and no Service Session enters
# one, so SERVICE would select no Session. This Environment references nothing
# and lists no Service; the runScope alone makes the template invalid.
specificationVersion: jobtemplate-2023-09
extensions: [SERVICE, EXPR]
name: StepEnvironmentServiceRunScope
services:
  - name: Store
    ports: [{name: main}]
    healthCheck: {type: STDOUT}
    script:
      actions:
        onRun:
          command: python3
          args: ["-c", "print('openjd_service_ready: up', flush=True); import time; time.sleep(600)"]
steps:
  - name: Use
    dependencies:
      - dependsOn: service:Store
    stepEnvironments:
      - name: Cfg
        runScope: [SERVICE]
        script:
          actions:
            onEnter:
              command: echo
              args: ["cfg"]
    script:
      actions:
        onRun:
          command: echo
          args: ["{{ Service.Store.main.port }}"]
