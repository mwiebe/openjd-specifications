# Section 9.6 item 3 / Section 9.7 item 4: onReadinessCheck must not be
# defined unless the readiness check type is COMMAND.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  - name: admin
  readinessCheck:
    type: STDOUT
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
      onReadinessCheck:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
