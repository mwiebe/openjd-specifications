# Section 4 item 4 (RFC 0009): `runScope` is a property of <Environment>, so
# it is accepted on Step Environments as well as Job Environments; on a Step
# Environment it may name TASK only (constraint 4).
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
steps:
- name: Step1
  stepEnvironments:
  - name: StepEnv
    runScope: [TASK]
    variables:
      FOO: bar
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
