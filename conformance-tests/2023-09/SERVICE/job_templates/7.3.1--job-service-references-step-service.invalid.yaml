# Section 9 scope rule 2: a Job Service cannot reference a Step Service.
# Step Services start after Job Services, so the endpoint cannot exist yet.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Coordinator.api.port }}"]
steps:
- name: Step1
  stepServices:
  - name: Coordinator
    ports:
    - name: api
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
