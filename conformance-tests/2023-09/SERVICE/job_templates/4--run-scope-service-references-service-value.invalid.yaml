# Section 4 item 3 constraint 2 / Section 9.7 item 2: an Environment whose
# runScope includes SERVICE must not reference any Service.* value, because
# a Service Session may begin before any Service other than its own has an
# endpoint.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  runScope: [SERVICE]
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
