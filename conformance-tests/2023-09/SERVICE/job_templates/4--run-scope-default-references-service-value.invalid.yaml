# Section 4 item 3 constraint 2: the default runScope (property omitted) is
# every kind of Session, which includes SERVICE, so such an Environment also
# must not reference Service.*. The Environment that configures Tasks to use
# a Service must declare `runScope: [TASK]`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
