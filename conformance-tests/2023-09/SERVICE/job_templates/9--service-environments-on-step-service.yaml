# Section 9 item 5 (RFC 0009): a Step Service may declare
# `serviceEnvironments` too; its names must differ from the Job Environments
# and from the declaring Step's Step Environments, but another Step's Step
# Environments and another Service's Service Environments may share a name.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: JobEnv
  variables:
    A: "1"
jobServices:
- name: Store
  serviceEnvironments:
  - name: Conda
    variables:
      B: "1"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  stepEnvironments:
  - name: StepEnv
    variables:
      C: "1"
  stepServices:
  - name: Coordinator
    serviceEnvironments:
    - name: Conda
      variables:
        D: "1"
    - name: Other
      variables:
        E: "1"
    ports:
    - name: api
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Step2
  stepEnvironments:
  - name: Other
    variables:
      F: "1"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
