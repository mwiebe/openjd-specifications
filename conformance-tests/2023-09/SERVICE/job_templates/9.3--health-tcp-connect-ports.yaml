# Section 9.3: a TCP_CONNECT check may name a subset of the declared ports to
# probe, with a ready timeout.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  - name: admin
  healthCheck:
    type: TCP_CONNECT
    ports: [admin]
    readyTimeoutSeconds: 30
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
