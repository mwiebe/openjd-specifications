# Section 9 scope rule 2: forward-only references apply within
# `stepServices` too.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
steps:
- name: Step1
  stepServices:
  - name: Front
    ports:
    - name: main
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()", "{{ Service.Back.main.port }}"]
  - name: Back
    ports:
    - name: main
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()", ]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
