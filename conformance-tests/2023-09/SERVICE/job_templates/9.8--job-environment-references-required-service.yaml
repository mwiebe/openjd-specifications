# Section 9 scope rule 4 / Section 9.8 item 2 (RFC 0009): a Job Environment
# may reference a required Service's `port` and `connectAddress` with no
# dependency, because a Job Environment has no `dependencies` in which to list
# one; this is the one exception to the dependency rule. The Environment's
# runScope defaults to [TASK]. Neither Step lists or references the Service.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  variables:
    EXT_HOST: "{{ Service.Ext.main.connectAddress }}"
    EXT_PORT: "{{ Service.Ext.main.port }}"
requiresServices:
- name: Ext
  ports:
  - name: main
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Step2
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
