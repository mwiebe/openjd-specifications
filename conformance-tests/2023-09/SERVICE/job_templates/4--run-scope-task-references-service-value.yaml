# Section 4 item 3 constraint 2 / Section 9 scope rule 3: an Environment
# whose explicit runScope excludes SERVICE may reference the `port` and
# `connectAddress` of any Service the document declares, in its variables,
# actions, and embedded files.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  runScope: [TASK]
  variables:
    STORE_HOST: "{{ Service.Store.main.connectAddress }}"
    STORE_PORT: "{{ Service.Store.main.port }}"
  script:
    actions:
      onEnter:
        command: python
        args: ["{{ Env.File.Setup }}"]
    embeddedFiles:
    - name: Setup
      type: TEXT
      data: |
        print("{{ join_host_port(Service.Store.main.connectAddress, Service.Store.main.port) }}")
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
