# Section 4 item 3 constraint 2 (RFC 0009): the default runScope follows the
# reference, but an explicit list is honored as written. `[TASK, SERVICE]`
# includes SERVICE, so the Environment must not reference Service.*.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  runScope: [TASK, SERVICE]
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
