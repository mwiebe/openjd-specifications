# Section 9.2 item 2: `port` may request a specific TCP port in 1-65535, as
# an integer or an integer string.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
    port: 6379
  - name: admin
    port: "65535"
  - name: low
    port: 1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
