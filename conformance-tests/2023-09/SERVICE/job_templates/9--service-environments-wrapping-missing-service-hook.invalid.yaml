# Section 4.3 constraint 6 / 9 item 5.2 (RFC 0009): a wrapping Service
# Environment must define all four onWrapService* hooks; onWrapServiceExit is
# missing here.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  serviceEnvironments:
  - name: Container
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args: ["-c", "print()"]
        onWrapEnvExit:
          command: python
          args: ["-c", "print()"]
        onWrapServiceEnter:
          command: python
          args: ["-c", "print()"]
        onWrapServiceRun:
          command: python
          args: ["-c", "print()"]
        onWrapServiceReadinessCheck:
          command: python
          args: ["-c", "print()"]
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
