# Section 3 item 6 constraint 5: the scope of a Step Service's `name` is the
# Step that defines it, so different Steps may each define a Step Service
# with the same `name`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
steps:
- name: Step1
  stepServices:
  - name: Coordinator
    ports:
    - name: api
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print({{ Service.Coordinator.api.port }})"]
- name: Step2
  stepServices:
  - name: Coordinator
    ports:
    - name: api
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print({{ Service.Coordinator.api.port }})"]
