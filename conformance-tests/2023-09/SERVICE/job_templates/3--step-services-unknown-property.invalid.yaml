# Section 3 (RFC 0009): a <StepTemplate> has no Service list; `stepServices`
# is an unknown property and is rejected. A Service is declared in the Job
# Template's `services` and scoped to the Step by reference (Section 9.1).
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
steps:
- name: Step1
  stepServices:
  - name: Coordinator
    ports:
    - name: main
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
