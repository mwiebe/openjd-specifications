# Section 4.3 (RFC 0008 single wrap layer, RFC 0009): a TASK-scoped wrapping
# Job Environment is not entered in Service Sessions, so a wrapping Service
# Environment is the one layer of the Service's Session while the Job
# Environment is the one layer of the Task's.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: TaskWrap
  runScope: [TASK]
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapTaskRun:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
jobServices:
- name: Store
  serviceEnvironments:
  - name: Container
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args: ["-c", "print()"]
        onWrapEnvExit:
          command: python
          args: ["-c", "print()"]
        onWrapServiceEnter:
          command: python
          args: ["-c", "print()"]
        onWrapServiceRun:
          command: python
          args: ["-c", "print()"]
        onWrapServiceReadinessCheck:
          command: python
          args: ["-c", "print()"]
        onWrapServiceExit:
          command: python
          args: ["-c", "print()"]
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
