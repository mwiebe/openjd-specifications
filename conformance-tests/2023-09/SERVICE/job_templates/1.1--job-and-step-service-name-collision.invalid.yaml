# Section 1.1 item 8 constraint 4 / Section 3 item 6 constraint 4: a Job
# Service must not have the same `name` as a Step Service in the same Job
# Template.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  stepServices:
  - name: Store
    ports:
    - name: main
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
