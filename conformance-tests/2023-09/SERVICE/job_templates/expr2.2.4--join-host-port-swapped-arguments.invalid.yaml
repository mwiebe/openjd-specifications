# Expression Language 2.2.4: join_host_port takes (host: string, port: int).
# Passing the port first is a type error at template validation.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ join_host_port(Service.Store.main.port, Service.Store.main.connectAddress) }}"]
