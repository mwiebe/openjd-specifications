# Section 9 item 5 / 7.3.1 scope rule 2 (RFC 0009): a Service Environment may
# reference the `port` and `connectAddress` of a Service earlier in the start
# order (READY before the Session begins); a Step Service's Service
# Environment may reference the Job Services.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Front
  serviceEnvironments:
  - name: Conda
    variables:
      BACK_URL: "tcp://{{ join_host_port(Service.Back.main.connectAddress, Service.Back.main.port) }}"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  stepServices:
  - name: Coordinator
    serviceEnvironments:
    - name: Conda
      variables:
        FRONT_PORT: "{{ Service.Front.main.port }}"
        OWN_BIND: "{{ Service.Coordinator.api.bindAddress }}"
    ports:
    - name: api
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
