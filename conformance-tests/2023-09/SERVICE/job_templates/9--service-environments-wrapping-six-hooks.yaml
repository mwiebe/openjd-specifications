# Section 4.3 constraint 6 / 9 item 5.2 (RFC 0009): a Service Environment has
# an effective `runScope` of [SERVICE], so a wrapping one defines
# onWrapEnvEnter, onWrapEnvExit, and the four onWrapService* hooks -- the way
# to wrap one Service in a container without wrapping anything else. Its hooks
# see WrappedService.* and the declaring Service's own scope, bindAddress
# included.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  serviceEnvironments:
  - name: Container
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args: ["-c", "print()", "{{ WrappedEnv.Name }}", "{{ WrappedAction.Command }}"]
        onWrapEnvExit:
          command: python
          args: ["-c", "print()", "{{ WrappedEnv.Name }}"]
        onWrapServiceEnter:
          command: python
          args: ["-c", "print()", "{{ WrappedService.Name }}"]
        onWrapServiceRun:
          command: python
          args: ["-c", "print()", "{{ repr_py(WrappedService.PortNames) }}", "{{ WrappedService.Ports[0] }}", "{{ WrappedService.BindAddresses[0] }}", "{{ Service.Store.main.bindAddress }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
        onWrapServiceReadinessCheck:
          command: python
          args: ["-c", "print()", "{{ WrappedAction.Timeout }}"]
        onWrapServiceExit:
          command: python
          args: ["-c", "print()", "{{ WrappedService.Name }}"]
  - name: Inner
    variables:
      INNER: "1"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
