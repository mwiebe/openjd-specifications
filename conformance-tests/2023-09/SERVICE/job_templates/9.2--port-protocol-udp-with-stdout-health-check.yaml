# Section 9.2 item 3: a port may declare `protocol: UDP`. Section 9 item 7: a
# Service none of whose ports is TCP must give a STDOUT or COMMAND health
# check, since the default TCP_CONNECT could never pass.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Telemetry
  ports:
  - name: ingest
    protocol: UDP
  healthCheck:
    type: STDOUT
    readinessTimeoutSeconds: 60
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
