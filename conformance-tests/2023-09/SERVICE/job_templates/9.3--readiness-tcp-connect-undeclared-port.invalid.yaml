# Section 9.3 item 2 / Section 9.7 item 4: every port a TCP_CONNECT check
# names must be declared in the Service's `ports`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  - name: admin
  readinessCheck:
    type: TCP_CONNECT
    ports: [main, metrics]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
