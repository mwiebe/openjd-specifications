# Section 9.2 item 3: `protocol` is an enum literal and is not @fmtstring; a
# format string is rejected even when it would resolve to a valid value.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
parameterDefinitions:
- name: Proto
  type: STRING
  default: UDP
jobServices:
- name: Telemetry
  ports:
  - name: ingest
    protocol: "{{ Param.Proto }}"
  readinessCheck:
    type: STDOUT
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
