# Section 1.1 item 8 / Section 9 (RFC 0009): a minimal Job Service. Only
# `name`, `ports`, and `script.actions.onRun` are required; readinessCheck
# defaults to TCP_CONNECT on every port and restartPolicy to
# { maxAttempts: 0, completedTasks: RERUN }.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print({{ Service.Store.main.port }})"]
