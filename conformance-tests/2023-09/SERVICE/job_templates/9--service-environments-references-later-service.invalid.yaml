# Section 9 item 5 / 7.3.1 scope rule 2 (RFC 0009): a Service Environment may
# reference only what its Service may; a Service later in the list is not in
# scope.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Front
  serviceEnvironments:
  - name: Conda
    variables:
      BACK_PORT: "{{ Service.Back.main.port }}"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
