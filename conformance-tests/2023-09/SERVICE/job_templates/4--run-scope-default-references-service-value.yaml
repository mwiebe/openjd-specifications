# Section 4 item 3 (RFC 0009): an Environment that references a Service.*
# value and gives no runScope defaults to [TASK], so it is entered in Task
# Sessions only and the reference is valid. The reference from a Job
# Environment puts every Step in the Service's scope (Section 9.1 rule 2).
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
