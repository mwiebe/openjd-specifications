# Section 7.3.1: `Service.File.<name>` is scoped to the declaring Service; a
# later Service cannot reference an earlier Service's embedded files.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["{{ Service.File.Serve }}"]
    embeddedFiles:
    - name: Serve
      type: TEXT
      data: "print()"
- name: Front
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.File.Serve }}"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
