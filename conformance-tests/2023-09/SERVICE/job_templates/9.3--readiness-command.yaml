# Section 9.3: a COMMAND check runs the Service's onReadinessCheck action
# every intervalSeconds until it exits 0 or timeoutSeconds elapses.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  - name: admin
  readinessCheck:
    type: COMMAND
    intervalSeconds: 2
    timeoutSeconds: 90
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
      onReadinessCheck:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
