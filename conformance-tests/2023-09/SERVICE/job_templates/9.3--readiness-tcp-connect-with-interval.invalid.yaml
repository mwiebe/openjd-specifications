# Section 9.3 item 3: `intervalSeconds` belongs to the COMMAND form only.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  - name: admin
  readinessCheck:
    type: TCP_CONNECT
    intervalSeconds: 5
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
