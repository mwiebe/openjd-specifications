# Section 9 item 5 (RFC 0009): a Service Environment never sees `Task.*`, and
# `Service.File.*` names the declaring Service's script files only, not an
# Environment's (which uses `Env.File.*`).
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  serviceEnvironments:
  - name: Conda
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print()", "{{ Service.File.Conf }}"]
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["{{ Service.File.Conf }}"]
    embeddedFiles:
    - name: Conf
      type: TEXT
      data: "port {{ Service.Store.main.port }}"
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
