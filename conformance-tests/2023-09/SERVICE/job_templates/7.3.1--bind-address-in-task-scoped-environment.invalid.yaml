# Section 4 scope list item 5 / Section 7.3.1: a TASK-scoped Environment may
# reference a Service's `port` and `connectAddress` only, never
# `bindAddress`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  runScope: [TASK]
  variables:
    STORE_BIND: "{{ Service.Store.main.bindAddress }}"
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
