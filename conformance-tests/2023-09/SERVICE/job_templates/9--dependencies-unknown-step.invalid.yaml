# Section 9 item 4 constraint 2 / Section 9.9 item 10 (RFC 0009): each
# `dependsOn` must name a Step of the same Job Template.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Indexer
  dependencies:
  - dependsOn: NoSuchStep
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Use
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Indexer.main.port }}"]
