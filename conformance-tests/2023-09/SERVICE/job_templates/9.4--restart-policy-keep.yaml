# Section 9.4: a restart policy with relaunches and completedTasks: KEEP,
# which also declares the Service resumable.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  restartPolicy:
    maxAttempts: 3
    completedTasks: KEEP
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
