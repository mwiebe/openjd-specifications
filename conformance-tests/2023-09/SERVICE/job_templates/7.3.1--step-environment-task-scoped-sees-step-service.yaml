# Section 9 scope rule 4: a Step Service is in scope in the declaring Step's
# stepEnvironments whose runScope excludes SERVICE (and every Job Service is
# too, per rule 3).
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  stepEnvironments:
  - name: Client
    runScope: [TASK]
    variables:
      COORD_PORT: "{{ Service.Coordinator.main.port }}"
      STORE_PORT: "{{ Service.Store.main.port }}"
  stepServices:
  - name: Coordinator
    ports:
    - name: main
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()", ]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
