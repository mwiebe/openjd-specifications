# Section 3 (RFC 0009): the `let` bindings of a <StepTemplate> are
# additionally available in `stepServices`, including in the Service's own
# `let`, `hostRequirements`, `variables`, and `script`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
parameterDefinitions:
- name: Workers
  type: INT
  default: 4
steps:
- name: Step1
  let:
  - threads = Param.Workers * 2
  stepServices:
  - name: Coordinator
    let:
    - label = "coord-" + string(threads)
    ports:
    - name: api
    variables:
      COORD_THREADS: "{{ threads }}"
      COORD_LABEL: "{{ label }}"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print({{ threads }}, {{ repr_py(label) }})"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print({{ threads }})"]
