# Section 9 item 5.1 (RFC 0009): a Service Environment may not have the name
# of a Job Environment.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  variables:
    A: "1"
jobServices:
- name: Store
  serviceEnvironments:
  - name: Conda
    variables:
      B: "1"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
