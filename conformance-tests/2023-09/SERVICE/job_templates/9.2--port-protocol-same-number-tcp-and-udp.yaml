# Section 9 item 6 constraint 4: two ports may give the same `port` number
# when their `protocol` differs, for a service that speaks TCP and UDP on one
# number (DNS-style). The default readiness check probes the TCP port.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Resolver
  ports:
  - name: tcp
    port: 5353
  - name: udp
    port: 5353
    protocol: UDP
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
