# Section 9.1 rule 3 (RFC 0009): a Job Environment that references a Service
# puts every Step in the Service's scope, including Steps that neither list
# the Service in `dependencies` nor mention it; this is the one way a Step
# enters a scope without a dependency. The Environment's runScope defaults to
# [TASK] (Section 4 item 3).
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  variables:
    COORD_PORT: "{{ Service.Coordinator.main.port }}"
services:
- name: Coordinator
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Step2
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
