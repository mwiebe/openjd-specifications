# Section 9.4: the defaults, written out explicitly: maxAttempts 0 (never
# relaunched) and completedTasks RERUN.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  restartPolicy:
    maxAttempts: 0
    completedTasks: RERUN
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
