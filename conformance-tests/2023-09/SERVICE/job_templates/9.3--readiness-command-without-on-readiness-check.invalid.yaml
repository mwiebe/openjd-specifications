# Section 9.3 item 1 / Section 9.6 item 3 / Section 9.7 item 4: a Service
# whose readiness check type is COMMAND must define onReadinessCheck.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  - name: admin
  readinessCheck:
    type: COMMAND
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
