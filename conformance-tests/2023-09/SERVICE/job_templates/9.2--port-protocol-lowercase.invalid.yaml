# Section 9.2 item 3: `protocol` values are literals; `udp` is not `UDP`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Telemetry
  ports:
  - name: ingest
    protocol: udp
  readinessCheck:
    type: STDOUT
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
