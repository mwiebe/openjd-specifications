# Section 9 item 5.1 (RFC 0009): a Step Service's Service Environment may not
# have the name of one of the declaring Step's Step Environments.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
steps:
- name: Step1
  stepEnvironments:
  - name: Conda
    variables:
      A: "1"
  stepServices:
  - name: Coordinator
    serviceEnvironments:
    - name: Conda
      variables:
        B: "1"
    ports:
    - name: api
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
