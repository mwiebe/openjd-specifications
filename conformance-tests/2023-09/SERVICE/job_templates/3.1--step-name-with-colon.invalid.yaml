# Section 3.1 constraint 4 / Section 9.9 item 12 (RFC 0009): when the template
# declares SERVICE, a Step's `name` must not contain `:`, so that a `dependsOn`
# value beginning `service:` can only name a Service.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
steps:
- name: "service:Store"
  dependencies:
  - dependsOn: service:Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
