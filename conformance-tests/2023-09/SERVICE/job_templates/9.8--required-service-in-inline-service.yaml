# Section 9.8 item 2 / Section 9 scope rules (RFC 0009): an inline Service may
# reference a required Service's `port` and `connectAddress` without listing
# it in `dependencies`; a required Service is READY before any Task runs. Use
# depends on service:Proxy, which puts Use in Proxy's scope.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
requiresServices:
- name: Ext
  ports:
  - name: main
services:
- name: Proxy
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Ext.main.connectAddress }}", "{{ Service.Ext.main.port }}"]
steps:
- name: Use
  dependencies:
  - dependsOn: service:Proxy
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Proxy.main.port }}"]
