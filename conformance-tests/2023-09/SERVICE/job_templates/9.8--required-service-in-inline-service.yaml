# Section 9.8 item 2 / Section 9 scope rule (RFC 0009): an inline Service may
# reference a required Service's `port` and `connectAddress`. The requirement
# is not part of the inline reference graph, so no cycle is possible.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
requiresServices:
- name: Ext
  ports:
  - name: main
services:
- name: Proxy
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Ext.main.connectAddress }}", "{{ Service.Ext.main.port }}"]
steps:
- name: Use
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Proxy.main.port }}"]
