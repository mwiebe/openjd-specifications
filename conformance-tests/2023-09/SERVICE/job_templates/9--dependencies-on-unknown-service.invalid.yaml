# Section 3.2 constraint 1 / Section 9 item 4 constraint 2 / Section 9.9 item 9
# (RFC 0009): a `service:` entry in a Service's `dependencies` must name a
# Service of the document's `services` or the Job Template's
# `requiresServices`. `service:Cache` names neither.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  dependencies:
  - dependsOn: service:Cache
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Use
  dependencies:
  - dependsOn: service:Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
