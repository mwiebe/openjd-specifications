# Section 3.1 constraint 4 (RFC 0009): the constraint on `:` in a Step's name
# is gated on the SERVICE extension and does not change the base schema. In a
# template that does not declare SERVICE, `service:Store` is an ordinary Step
# name, and `dependsOn: service:Store` names that Step as it always has. This
# fixture lives in the SERVICE suite because it pins the gating.
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: "service:Store"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Use
  dependencies:
  - dependsOn: "service:Store"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
