# Section 9 scope rule 3 (RFC 0009): a Step Environment whose explicit
# runScope excludes SERVICE may reference the `port` and `connectAddress` of
# every Service its Step lists in `dependencies`; a Step Environment follows
# its Step's dependencies (Section 9.1 rule 1).
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
- name: Coordinator
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  dependencies:
  - dependsOn: service:Store
  - dependsOn: service:Coordinator
  stepEnvironments:
  - name: Client
    runScope: [TASK]
    variables:
      COORD_PORT: "{{ Service.Coordinator.main.port }}"
      STORE_HOST: "{{ Service.Store.main.connectAddress }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
