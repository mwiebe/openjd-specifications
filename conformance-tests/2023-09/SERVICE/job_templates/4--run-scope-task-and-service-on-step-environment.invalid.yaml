# Template Schemas §4 item 4 (runScope) constraint 4: a stepEnvironments
# entry's runScope must not include SERVICE even alongside TASK. The list
# [TASK, SERVICE] names a Session kind that never enters a Step Environment.
specificationVersion: jobtemplate-2023-09
extensions: [SERVICE, EXPR]
name: StepEnvironmentTaskAndServiceRunScope
services:
  - name: Store
    ports: [{name: main}]
    healthCheck: {type: STDOUT}
    script:
      actions:
        onRun:
          command: python3
          args: ["-c", "print('openjd_service_ready: up', flush=True); import time; time.sleep(600)"]
steps:
  - name: Use
    dependencies:
      - dependsOn: service:Store
    stepEnvironments:
      - name: Cfg
        runScope: [TASK, SERVICE]
        script:
          actions:
            onEnter:
              command: echo
              args: ["cfg"]
    script:
      actions:
        onRun:
          command: echo
          args: ["{{ Service.Store.main.port }}"]
