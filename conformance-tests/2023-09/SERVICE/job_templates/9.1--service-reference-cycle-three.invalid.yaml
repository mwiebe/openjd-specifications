# Section 9.1 rule 3 / Section 9.9 item 9: a cycle through three Services
# (A -> B -> C -> A) is rejected like a cycle of two. Only references between
# Services matter; the Step's reference to A is not part of the cycle.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: A
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.B.main.connectAddress }}"]
- name: B
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.C.main.connectAddress }}"]
- name: C
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.A.main.connectAddress }}"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.A.main.port }}"]
