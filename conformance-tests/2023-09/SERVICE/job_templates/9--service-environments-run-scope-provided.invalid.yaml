# Section 9 item 5.2 (RFC 0009): `runScope` must not be provided on a Service
# Environment; its scope is fixed to the declaring Service's Session.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  serviceEnvironments:
  - name: Conda
    runScope: [SERVICE]
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print()"]
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
