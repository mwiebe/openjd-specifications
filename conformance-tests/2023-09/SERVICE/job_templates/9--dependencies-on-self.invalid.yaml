# Section 3.2 constraint 1 / Section 9 item 4 constraint 2 (RFC 0009): a
# Service may not list itself in its `dependencies`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  dependencies:
  - dependsOn: service:Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Use
  dependencies:
  - dependsOn: service:Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
