# Section 9 scope rule 4 / Section 4 item 3 constraint 2: a Step Environment
# with the default runScope is entered in the Step Service's own Service
# Session, so it cannot reference the Service.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
steps:
- name: Step1
  stepEnvironments:
  - name: Client
    variables:
      COORD_PORT: "{{ Service.Coordinator.main.port }}"
  stepServices:
  - name: Coordinator
    ports:
    - name: main
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()", ]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
