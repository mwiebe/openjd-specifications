# Section 9.3 item 3: `readinessIntervalSeconds` is accepted on a TCP_CONNECT
# check (default 1) as well as on COMMAND; only STDOUT rejects it.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  - name: admin
  healthCheck:
    type: TCP_CONNECT
    readinessIntervalSeconds: 5
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
