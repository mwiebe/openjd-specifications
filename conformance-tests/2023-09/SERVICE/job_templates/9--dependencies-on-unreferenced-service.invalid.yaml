# Section 9 item 4 constraint 3 / Section 9.1 rule 4 (RFC 0009): a Service
# that nothing references has every Step in its scope, so any dependency names
# a Step in its own scope and is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Indexer
  dependencies:
  - dependsOn: Prepare
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Prepare
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Other
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
