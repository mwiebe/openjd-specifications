# Section 9.6 / Section 5: every Service action is an <Action>, so the
# ordinary <Action> constraints apply; an empty command must be rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: ""
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
