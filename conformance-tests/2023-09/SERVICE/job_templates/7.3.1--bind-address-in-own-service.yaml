# Section 7.3.1 (RFC 0009): all three values -- port, bindAddress, and
# connectAddress -- are in scope within the declaring Service itself.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobServices:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.bindAddress }}", "{{ Service.Store.main.port }}", "{{ Service.Store.main.connectAddress }}"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
