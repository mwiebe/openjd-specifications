# Section 1.2 item 5 / Section 4 item 3 constraint 2: the Environment may
# reference the document's Services only when its runScope excludes SERVICE.
# With the default runScope it is entered in the Service's own Session, so
# the reference must be rejected.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Cache
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
environment:
  name: CacheClient
  variables:
    CACHE_PORT: "{{ Service.Cache.main.port }}"
