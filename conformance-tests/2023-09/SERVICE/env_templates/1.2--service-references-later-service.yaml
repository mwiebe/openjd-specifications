# Section 1.2 item 6 constraint 4 / Section 9.1 rule 3 (RFC 0009): list order
# carries no meaning in an Environment Template's `services` either. Front
# may reference Back although Back is listed after it.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Front
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Back.main.port }}"]
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
