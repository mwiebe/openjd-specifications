# Section 1.2.2 / 9 item 5 (RFC 0009): an external Service declares
# `serviceEnvironments` like any Service; they are carried through submission
# with the Service and entered only in its Session. A Service Environment may
# reference the declaring Service's own endpoints, `bindAddress` included, and
# an earlier Service's `port` / `connectAddress`.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
parameterDefinitions:
- name: CacheSize
  type: INT
  default: 64
services:
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Cache
  serviceEnvironments:
  - name: ValkeyConda
    variables:
      CACHE_SIZE: "{{ Param.CacheSize }}"
      CACHE_BIND: "{{ Service.Cache.main.bindAddress }}:{{ Service.Cache.main.port }}"
      BACK_URL: "tcp://{{ join_host_port(Service.Back.main.connectAddress, Service.Back.main.port) }}"
    script:
      actions:
        onEnter:
          command: python
          args: ["{{ Env.File.Provision }}", "{{ Job.Name }}"]
      embeddedFiles:
      - name: Provision
        type: TEXT
        data: "bind {{ Service.Cache.main.bindAddress }}"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
