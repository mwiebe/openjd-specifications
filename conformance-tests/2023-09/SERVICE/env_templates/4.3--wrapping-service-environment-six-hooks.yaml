# Section 4.3 constraint 6 / 9 item 5.2 (RFC 0009): a wrapping Service
# Environment of an external Service defines onWrapEnvEnter, onWrapEnvExit,
# and the four onWrapService* hooks (effective runScope [SERVICE]); it may
# coexist with the document's own wrapping Environment when that one is
# TASK-scoped, since the two are never in the same Session.
specificationVersion: environment-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
services:
- name: Cache
  serviceEnvironments:
  - name: Container
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args: ["-c", "print()"]
        onWrapEnvExit:
          command: python
          args: ["-c", "print()"]
        onWrapServiceEnter:
          command: python
          args: ["-c", "print()"]
        onWrapServiceRun:
          command: python
          args: ["-c", "print()"]
        onWrapServiceReadinessCheck:
          command: python
          args: ["-c", "print()"]
        onWrapServiceExit:
          command: python
          args: ["-c", "print()"]
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
environment:
  name: TaskWrap
  runScope: [TASK]
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapTaskRun:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
