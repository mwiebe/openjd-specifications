# Section 1.2 item 5 / Section 7.3.1: the Environment may reference a
# Service's `port` and `connectAddress`, never its `bindAddress`.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Cache
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
environment:
  name: CacheClient
  runScope: [TASK]
  variables:
    CACHE_BIND: "{{ Service.Cache.main.bindAddress }}"
