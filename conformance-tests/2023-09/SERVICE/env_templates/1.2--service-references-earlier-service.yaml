# Section 1.2 item 6 constraint 4: a Service in `services` may reference the
# endpoints of Services earlier in the list, as in `jobServices`.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
- name: Front
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Back.main.connectAddress }}", "{{ Service.Back.main.port }}"]
