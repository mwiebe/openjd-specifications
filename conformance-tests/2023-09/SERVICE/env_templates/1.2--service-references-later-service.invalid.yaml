# Section 1.2 item 6 constraint 4 / Section 1.2.2: references within an
# Environment Template's `services` are forward-only.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Front
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Back.main.port }}"]
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
