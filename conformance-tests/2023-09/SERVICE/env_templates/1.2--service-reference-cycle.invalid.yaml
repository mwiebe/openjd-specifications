# Section 1.2 item 6 constraint 4 / Section 9.9 item 9: the references among
# an Environment Template's Services must be acyclic.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Front
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Back.main.port }}"]
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Front.main.port }}"]
