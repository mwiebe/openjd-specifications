# Section 9 item 5 / 7.3.1 (RFC 0009): an external Service's Service
# Environment may not reference a Service later in the document's list.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Front
  serviceEnvironments:
  - name: Conda
    variables:
      BACK_PORT: "{{ Service.Back.main.port }}"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
