# Template Schemas §4 item 4 constraint 2 (RFC 0010): runScope is not permitted on a stepEnvironments
# entry.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
name: TestJob
steps:
- name: Render
  stepEnvironments:
  - name: Conda
    runScope: ALL
    script:
      actions:
        onEnter:
          command: echo
          args: ["enter"]
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
