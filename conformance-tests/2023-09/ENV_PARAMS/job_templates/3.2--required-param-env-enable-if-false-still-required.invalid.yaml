# Template Schemas §3.2 constraint 7 and §4 item 6 (RFC 0010): constraint 7 is checked before an
# Environment's enableIf is applied, so enableIf: false does not exempt Step A from supplying Lic's Product,
# which has no default.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: TestJob
jobEnvironments:
- name: Lic
  envParameterDefinitions:
  - name: Product
    type: STRING
  enableIf: false
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "{{Env.Param.Product}}"]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
