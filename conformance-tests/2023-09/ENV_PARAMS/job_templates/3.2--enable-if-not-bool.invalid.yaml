# Template Schemas §3.2 constraint 9 (RFC 0010): enableIf must be a boolean literal or a single {{ }}
# expression of type bool. Param.Count is an INT, and the Expression Language has no implicit int-to-bool
# conversion, so the entry is rejected at template validation.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Count
  type: INT
  default: 1
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: "{{ Param.Count }}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
