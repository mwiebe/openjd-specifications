# Template Schemas §3.2 constraint 7 (RFC 0010): a Step that requests an ONLY_REQUESTED Environment must
# supply its parameters without a default. The entry requests Conda without supplying Packages.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
name: TestJob
jobEnvironments:
- name: Conda
  runScope: ONLY_REQUESTED
  envParameterDefinitions:
  - name: Packages
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
