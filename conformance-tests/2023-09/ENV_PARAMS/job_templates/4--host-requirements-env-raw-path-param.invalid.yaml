# Template Schemas §4 item 5.1 (RFC 0010): an Environment's hostRequirements may reference its own
# Env.Param.* and Env.RawParam.* only of types other than PATH and LIST[PATH], so Env.RawParam of a PATH
# parameter is rejected even though its value is a string.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
name: TestJob
parameterDefinitions:
- name: Dir
  type: PATH
jobEnvironments:
- name: Gpu
  parameterDefinitions:
  - name: CacheDir
    type: PATH
    default: "{{RawParam.Dir}}"
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: ["{{Env.RawParam.CacheDir}}"]
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
