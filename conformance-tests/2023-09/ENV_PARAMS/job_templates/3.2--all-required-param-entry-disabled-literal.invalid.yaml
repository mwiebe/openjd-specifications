# Template Schemas §3.2 item 5 and constraint 7 (RFC 0010): a disabled entry supplies nothing, and a Step
# still enters an ALL Environment. The only entry for Conda has enableIf: false, a literal, so the check
# is made at template validation and Packages is not supplied.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: false
    parameters:
      Packages: ffmpeg
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
