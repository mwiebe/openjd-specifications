# Template Schemas §3.2 item 1 (RFC 0010): with ENV_PARAMS, step: is a synonym of dependsOn:, so an entry
# naming an earlier Step with step: is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
name: TestJob
steps:
- name: First
  script:
    actions:
      onRun:
        command: echo
        args: ["first"]
- name: Second
  dependencies:
  - step: First
  script:
    actions:
      onRun:
        command: echo
        args: ["second"]
