# Template Schemas §4 item 3 constraint 4 (RFC 0010): parameterDefinitions are not permitted on a
# stepEnvironments entry.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
name: TestJob
steps:
- name: Render
  stepEnvironments:
  - name: Conda
    parameterDefinitions:
    - name: Packages
      type: STRING
      default: numpy
    script:
      actions:
        onEnter:
          command: echo
          args: ["enter"]
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
