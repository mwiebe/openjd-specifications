# Template Schemas §4.5 item 3 (RFC 0010): objectType is not permitted on a PATH Environment parameter.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
name: TestJob
parameterDefinitions:
- name: Dir
  type: PATH
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: CacheDir
    type: PATH
    default: "{{RawParam.Dir}}"
    objectType: DIRECTORY
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
