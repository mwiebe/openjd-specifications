# Template Schemas §4 item 4 (RFC 0010): runScope: ALL on a Job Environment is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
name: TestJob
jobEnvironments:
- name: Conda
  runScope: ALL
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
