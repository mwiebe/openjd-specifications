# Template Schemas §4.5 item 3 (RFC 0010): objectType is not permitted on an Environment parameter of type
# LIST[PATH].
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Docker
  envParameterDefinitions:
  - name: Mounts
    type: LIST[PATH]
    objectType: DIRECTORY
    default: []
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
