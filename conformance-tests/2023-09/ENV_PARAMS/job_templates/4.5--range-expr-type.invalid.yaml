# Template Schemas §4.5 item 1 (RFC 0010): an Environment parameter may have any type available to a Job
# Parameter except RANGE_EXPR, so type RANGE_EXPR is rejected even with EXPR.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    default: "1-10"
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
