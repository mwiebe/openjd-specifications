# Template Schemas §4 item 4 constraint 2 (RFC 0010): activation is not permitted on a stepEnvironments
# entry.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
steps:
- name: Render
  stepEnvironments:
  - name: Conda
    activation: ALWAYS
    script:
      actions:
        onEnter:
          command: echo
          args: ["enter"]
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
