# Template Schemas §3.2 constraint 9 (RFC 0010): a format-string enableIf must consist of a single {{ }}
# expression, so "x{{ true }}" is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: "x{{ true }}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
