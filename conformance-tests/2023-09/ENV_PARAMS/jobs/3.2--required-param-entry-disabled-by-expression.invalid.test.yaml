# RFC 0010 / Template Schemas §3.2 constraint 7 (checked at job creation for an
# entry whose enableIf is an expression): the only entry that supplies an ALWAYS
# Job Environment's required parameter has an enableIf that resolves to false,
# so the Step supplies nothing and the Job is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: RequiredParamEntryDisabledByExpression
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      enableIf: "{{ 'Nope' in Job.EnvNames }}"
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
