# RFC 0010 / Template Schemas §3.2 item 5: a disabled entry for an ALWAYS
# Environment supplies nothing; the Session still enters the Environment, with
# every parameter at its default.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: EnableIfFalseAllTakesDefaults
  parameterDefinitions:
  - name: Mode
    type: STRING
    allowedValues: ["on", "off"]
  jobEnvironments:
  - name: Lic
    activation: ALWAYS
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: pdefault
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      enableIf: "{{ Param.Mode == 'on' }}"
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Mode: "off"
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Product=pdefault
  forbidden:
  - ENTER Lic Product=arnold
