# RFC 0010 / Template Schemas §4 runScope ONLY_REQUESTED: a Step (B) that does
# not request an ONLY_REQUESTED Job Environment never enters it, so its onEnter
# never runs with the default value.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS]
  name: OnlyRequestedNotEnteredByOther
  jobEnvironments:
  - name: Lic
    runScope: ONLY_REQUESTED
    parameterDefinitions:
    - name: Product
      type: STRING
      default: pdefault
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
  - name: B
    dependencies:
    - dependsOn: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, B]
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Product=arnold
  - TASK B
  forbidden:
  - ENTER Lic Product=pdefault
