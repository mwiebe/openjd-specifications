# RFC 0010 / Template Schemas §3.3.3 item 2: an attached ALL Environment
# requires anyOf [b] and the Step requires anyOf [a] of the same attribute; the
# combined requirements conflict and the submission is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS]
  name: AttachedEnvironmentConflict
  steps:
  - name: A
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [a]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS]
  environment:
    name: Hw
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [b]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw]
runOn: [posix, windows]
