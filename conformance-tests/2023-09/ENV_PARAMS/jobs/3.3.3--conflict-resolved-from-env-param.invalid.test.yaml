# RFC 0010 / Template Schemas §4 hostRequirements item 1, §3.3.3 item 2: the
# Environment's anyOf ["{{Env.Param.Flavor}}"] resolves with the Step's value c,
# which is not in the Step's own anyOf [a, b]. The conflict exists only after
# resolution, and the submission is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS]
  name: ConflictResolvedFromEnvParam
  jobEnvironments:
  - name: Hw
    activation: ALWAYS
    envParameterDefinitions:
    - name: Flavor
      type: STRING
      default: a
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: ["{{Env.Param.Flavor}}"]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw, "Flavor={{Env.Param.Flavor}}"]
  steps:
  - name: A
    dependencies:
    - environment: Hw
      parameters:
        Flavor: c
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [a, b]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
