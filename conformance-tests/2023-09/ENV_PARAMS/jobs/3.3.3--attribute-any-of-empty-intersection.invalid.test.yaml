# RFC 0010 / Template Schemas §3.3.3 item 2: the Step requires anyOf [a] and
# an Environment its Sessions enter requires anyOf [b] of the same attribute;
# the intersection is empty, so the submission is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS]
  name: AttributeAnyOfEmptyIntersection
  jobEnvironments:
  - name: Hw
    runScope: ALL
    envParameterDefinitions:
    - name: Flavor
      type: STRING
      default: a
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [b]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw, "Flavor={{Env.Param.Flavor}}"]
  steps:
  - name: A
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [a]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
