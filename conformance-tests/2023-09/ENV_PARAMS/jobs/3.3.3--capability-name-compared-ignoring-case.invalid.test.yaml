# RFC 0010 / Template Schemas §3.3.3 ("names compare after resolution and
# ignoring case") and item 2: the Step's conformance:attr.Flavor and a Job
# Environment's conformance:attr.flavor are one capability, so anyOf [a] and
# anyOf [b] have an empty intersection and the submission is rejected at job
# creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS]
  name: CapabilityNameIgnoresCase
  jobEnvironments:
  - name: Hw
    activation: ALWAYS
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [b]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw]
  steps:
  - name: A
    hostRequirements:
      attributes:
      - name: conformance:attr.Flavor
        anyOf: [a]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
