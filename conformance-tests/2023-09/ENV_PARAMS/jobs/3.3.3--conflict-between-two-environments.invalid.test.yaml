# RFC 0010 / Template Schemas §3.3.3 item 2 (conflicting sources may be two
# Environments the Step's Sessions enter): two ALL Job Environments
# require disjoint anyOf values of one attribute, so every Step's combined
# requirements conflict and the submission is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS]
  name: ConflictBetweenTwoEnvironments
  jobEnvironments:
  - name: E1
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [a]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, E1]
  - name: E2
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [b]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, E2]
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
