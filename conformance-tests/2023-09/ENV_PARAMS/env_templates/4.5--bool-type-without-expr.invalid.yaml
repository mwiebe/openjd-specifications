# Template Schemas §4.5 item 1 (RFC 0010): a BOOL Environment parameter requires the EXPR extension. This
# Environment Template lists ENV_PARAMS but not EXPR.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
environment:
  name: Conda
  envParameterDefinitions:
  - name: Verbose
    type: BOOL
    default: false
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
