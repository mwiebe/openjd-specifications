# Template Schemas §4 item 4 (RFC 0010): runScope: ONLY_REQUESTED on an Environment Template's environment
# is valid.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
environment:
  name: Conda
  runScope: ONLY_REQUESTED
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
