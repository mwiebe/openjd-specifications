# Template Schemas §4.5 items 1 and 4 (RFC 0010): with EXPR, a LIST[PATH] Environment parameter with the
# literal default [] is valid, as in the Docker sample Environment Template.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
- EXPR
environment:
  name: Docker
  parameterDefinitions:
  - name: Mounts
    type: LIST[PATH]
    default: []
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
