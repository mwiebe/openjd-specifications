# Template Schemas §4 item 3 constraint 3 (RFC 0010): no two definitions in an Environment's
# parameterDefinitions may have the same name.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
environment:
  name: Conda
  parameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  - name: Packages
    type: STRING
    default: scipy
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
