# Template Schemas §4 item 4 constraint 1 (RFC 0010): an implementation MUST reject a <RunScope> it does
# not recognize, so runScope: SOMETIMES is rejected.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
environment:
  name: Conda
  runScope: SOMETIMES
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
