# Template Schemas §4.5 item 1 (RFC 0010): a LIST[PATH] Environment parameter requires the EXPR extension.
# This Environment Template lists ENV_PARAMS but not EXPR.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
environment:
  name: Docker
  parameterDefinitions:
  - name: Mounts
    type: LIST[PATH]
    default: []
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
