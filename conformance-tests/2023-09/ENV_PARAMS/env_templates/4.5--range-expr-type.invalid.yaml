# Template Schemas §4.5 item 1 (RFC 0010): type RANGE_EXPR is not available to an Environment parameter,
# even with EXPR.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
- EXPR
environment:
  name: Conda
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    default: "1-10"
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
