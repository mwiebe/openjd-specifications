# RFC 0011 §The Steps.* scope, Where available item 3: a direct dependent may read
# Steps.P.* in its enableIf, let, parameterSpace range, stepEnvironments, and script.
# CEnv reads Steps.P.* in its enableIf (RFC 0011 §<Environment> item 1) and its variables.
# 7.3.1--steps-in-host-requirements and 7.3.1--steps-in-action-timeout cover the other fields.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
- name: C
  enableIf: 'Steps.P.Output.N > 0'
  let:
  - n2 = Steps.P.Output.N * 2
  dependencies:
  - dependsOn: P
  stepEnvironments:
  - name: CEnv
    enableIf: 'Steps.P.Output.N > 0'
    variables:
      CF_N: '{{Steps.P.Output.N}}'
  parameterSpace:
    taskParameterDefinitions:
    - name: F
      type: INT
      range: 1-{{Steps.P.Output.N}}
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.P.Output.N}}, {{n2}}, {{Task.Param.F}})
