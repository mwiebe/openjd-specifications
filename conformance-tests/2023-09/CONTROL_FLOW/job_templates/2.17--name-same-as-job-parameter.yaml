# RFC 0010 §Job Template, jobOutputDefinitions constraint 3: job output and job parameter
# names are separate namespaces, so they may share a name.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Count
  type: INT
  default: 1
jobOutputDefinitions:
- name: Count
  type: INT
  value: '{{Param.Count * 2}}'
steps:
- name: S
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
