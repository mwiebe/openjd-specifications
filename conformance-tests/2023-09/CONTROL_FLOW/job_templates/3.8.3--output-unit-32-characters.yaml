# RFC 0013 §<LoopOutputVariableDefinition> item 5 and RFC 0012 §<OutputVariableDefinition>
# item 5: a loop output's unit is 1 to 32 characters, so 32 is accepted, with a
# description.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: 'Loop.Iteration >= 0'
    maxIterations: 1
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('W_' + 'RAN')
  outputVariables:
  - name: O
    type: INT
    collect: LAST
    value: '{{Loop.Iteration}}'
    description: Iteration index
    unit: uuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuu
