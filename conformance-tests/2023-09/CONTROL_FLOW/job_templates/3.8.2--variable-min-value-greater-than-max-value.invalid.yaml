# RFC 0013 §Validation item 5 and RFC 0012 §<OutputVariableDefinition> constraint 2: a loop
# variable's minValue may not exceed its maxValue.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables:
    - name: N
      type: INT
      initial: '{{0}}'
      next: '{{Loop.N}}'
      minValue: 5
      maxValue: 2
    until: 'Loop.Iteration >= 0'
    maxIterations: 1
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('W_' + 'RAN')
