# RFC 0013 §The Loop.* scope, Where available item 3: Loop.* is not available in a top-level
# Step.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
- name: C
  dependencies:
  - dependsOn: L
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Loop.Iteration}})
