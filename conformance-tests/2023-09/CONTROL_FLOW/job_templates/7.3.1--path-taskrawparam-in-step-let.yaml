# RFC 0010 §The Steps.* scope: Steps.P.TaskRawParam reads a PATH Task parameter's values
# unmapped and is available in TEMPLATE-scope fields.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  parameterSpace:
    taskParameterDefinitions:
    - name: F
      type: PATH
      range:
      - /mnt/in/a
      - /mnt/in/b
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: C
  let:
  - ps = Steps.P.TaskRawParam.F
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{len(ps)}})
