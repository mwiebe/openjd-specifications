# RFC 0011 §The Steps.* scope: Steps.* is not available in jobEnvironments.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
jobEnvironments:
- name: E
  variables:
    CF_N: '{{Steps.P.Output.N}}'
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
