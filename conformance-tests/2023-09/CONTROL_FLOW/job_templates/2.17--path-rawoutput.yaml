# RFC 0011 §<JobOutputDefinition> item 3: a PATH output is read through RawOutput.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
jobOutputDefinitions:
- name: F
  type: PATH
  value: '{{Steps.P.RawOutput.F}}'
- name: Fs
  type: LIST[PATH]
  value: '{{Steps.P.RawOutput.Fs}}'
steps:
- name: P
  outputVariables:
  - name: F
    type: PATH
  - name: Fs
    type: LIST[PATH]
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: F="/mnt/out/a.exr"'); print('openjd_output_var: Fs=["/mnt/out/a.exr"]')
