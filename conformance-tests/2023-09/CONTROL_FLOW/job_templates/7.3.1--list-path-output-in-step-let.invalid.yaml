# RFC 0011 §Validation item 5: the host-only rule applies to any Output whose type is or
# contains path, so a LIST[PATH] output is not available in a step-level let either.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: F
    type: PATH
  - name: Fs
    type: LIST[PATH]
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: F="/mnt/out/a.exr"'); print('openjd_output_var: Fs=["/mnt/out/a.exr"]')
- name: C
  let:
  - n = len(Steps.P.Output.Fs)
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{n}})
