# RFC 0013 §<StepLoop> outputVariables constraint 2: at most 32 loop outputs, so 32 is
# accepted.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: '{{Loop.Iteration >= 0}}'
    maxIterations: 1
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('W_' + 'RAN')
  outputVariables:
  - name: O1
    type: INT
    collect: LAST
    value: '{{Loop.Iteration}}'
  - name: O2
    type: INT
    collect: LAST
    value: '{{Loop.Iteration}}'
