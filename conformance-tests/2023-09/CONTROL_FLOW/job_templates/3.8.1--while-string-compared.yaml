# RFC 0013 §<LoopDefinition> item 2: a STRING loop variable is compared in while, as in
# Loop.Token != 'b'. The valid companion of 3.8.1--while-string-typed.invalid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables:
    - name: Token
      type: STRING
      initial: '{{''a''}}'
      next: '{{''b''}}'
    while: 'Loop.Token != ''b'''
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
