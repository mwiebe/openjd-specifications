# RFC 0010 §<StepTemplate> enableIf constraint 1: may reference Param.* (static enableIf).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Run
  type: BOOL
  default: true
- name: N
  type: INT
  default: 3
steps:
- name: A
  enableIf: '{{Param.Run}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: B
  enableIf: '{{Param.N > 2}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
