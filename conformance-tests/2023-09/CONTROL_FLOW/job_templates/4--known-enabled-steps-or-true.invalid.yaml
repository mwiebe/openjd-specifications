# RFC 0011 §Terminology "Known to be enabled" and §<Environment> item 3 ("Before Job creation"
# and "Known to be enabled" bullets), with RFC 0010's Template Schemas §3.2 constraint 7: E is
# a BY_DEFAULT Job Environment whose Pkg has no default, so it applies to S, which supplies no
# value for Pkg. Constraint 7 is checked before Job creation only for a Step known to be
# enabled, one whose enableIf is absent or known to be true by Template Schemas §7.6 rule 5,
# with Steps.*, Loop.*, and RawLoop.* not yet known.
#
# S's enableIf is Steps.A.Output.Ok or true, which is known to be true with A's output not
# yet known, so the missing value is an error at template validation, although S is
# PENDING_INPUTS at Job creation and makes its Environment selection at step input binding.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: F
  type: BOOL
  default: true
jobEnvironments:
- name: E
  envParameterDefinitions:
  - name: Pkg
    type: STRING
  script:
    actions:
      onEnter:
        command: python
        args:
        - -c
        - |-
          print('E_' + 'IN', '{{Env.Param.Pkg}}')
steps:
- name: A
  dependencies:
  - environment: E
    parameters:
      Pkg: a
  outputVariables:
  - name: Ok
    type: BOOL
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Ok=true')
- name: S
  enableIf: Steps.A.Output.Ok or true
  dependencies:
  - dependsOn: A
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('S_' + 'RAN')
