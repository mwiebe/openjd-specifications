# RFC 0010 Technical Requirement 4 / Validation item 7: expressions over Steps.* are
# type-checked at validation; a BOOL output in integer arithmetic is a type error.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: B
    type: BOOL
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: B=true')
- name: C
  let:
  - x = Steps.P.Output.B - 1
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{x}})
