# RFC 0011 §Design Choice 12 (What changes for authors): a STRING parameter is compared
# in enableIf, here Param.Mode == 'true'. The valid companion of
# 3--enableif-string-typed.invalid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Mode
  type: STRING
  default: 'true'
steps:
- name: A
  enableIf: 'Param.Mode == ''true'''
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
