# RFC 0013 §Steps.* in and around a loop item 1: a body Step reads another body Step only if
# it lists it in its own dependencies.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: A
      outputVariables:
      - name: X
        type: INT
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('openjd_output_var: X=1')
    - name: B
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print({{Steps.A.Output.X}})
