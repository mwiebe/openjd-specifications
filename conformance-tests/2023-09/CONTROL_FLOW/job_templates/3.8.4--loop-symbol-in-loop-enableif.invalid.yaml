# RFC 0013 §The Loop.* scope, Where available item 3: Loop.* is not available in the loop's
# own enableIf.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  enableIf: '{{Loop.N == 0}}'
  loop:
    variables:
    - name: N
      type: INT
      initial: '{{0}}'
      next: '{{Loop.N + 1}}'
    until: '{{Loop.Iteration >= 1}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  outputVariables:
  - name: Last
    type: INT
    collect: LAST
    value: '{{Loop.N}}'
