# RFC 0013 §<LoopDefinition> item 4 / §Limits item 1: maxIterations is at most 1,000.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: 'true'
    maxIterations: 1001
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
