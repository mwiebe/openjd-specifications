# RFC 0013 §<StepLoop>: a <StepLoop> has no parameterSpace.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  parameterSpace:
    taskParameterDefinitions:
    - name: X
      type: INT
      range: 1-2
