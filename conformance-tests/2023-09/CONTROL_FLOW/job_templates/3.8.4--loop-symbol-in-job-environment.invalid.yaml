# RFC 0013 §The Loop.* scope, Where available item 3: Loop.* is not available in a Job
# Environment.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
jobEnvironments:
- name: Env
  script:
    actions:
      onEnter:
        command: python
        args:
        - -c
        - |-
          print({{Loop.Iteration}})
steps:
- name: L
  loop:
    variables:
    - name: N
      type: INT
      initial: '{{0}}'
      next: '{{Loop.N + 1}}'
    until: '{{Loop.Iteration >= 1}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  outputVariables:
  - name: Last
    type: INT
    collect: LAST
    value: '{{Loop.N}}'
