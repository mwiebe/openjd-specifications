# RFC 0011 §The Steps.* scope, Where available item 3, and §Materialization groups
# item 3: a direct dependent's hostRequirements may read Steps.P.*, in an amount's min
# (a format string with FEATURE_BUNDLE_1) and an attribute's anyOf.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- FEATURE_BUNDLE_1
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: Gpus
    type: INT
  - name: Os
    type: STRING
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Gpus=1'); print('openjd_output_var: Os="linux"')
- name: C
  dependencies:
  - dependsOn: P
  hostRequirements:
    amounts:
    - name: amount.worker.gpu
      min: '{{Steps.P.Output.Gpus}}'
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - '{{Steps.P.Output.Os}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print()
