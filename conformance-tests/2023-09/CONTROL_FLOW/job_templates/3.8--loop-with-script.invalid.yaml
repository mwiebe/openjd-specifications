# RFC 0013 §<StepLoop>: a <StepLoop> has no other properties than its own; in particular no
# script.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print()
