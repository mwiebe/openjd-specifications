# RFC 0011 §<JobOutputDefinition> item 3: values whose type contains path are read through
# TaskRawParam, here of a PATH Task parameter. Positive pair for 2.17--path-taskparam.invalid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
jobOutputDefinitions:
- name: Files
  type: LIST[PATH]
  value: '{{Steps.P.TaskRawParam.F}}'
steps:
- name: P
  parameterSpace:
    taskParameterDefinitions:
    - name: F
      type: PATH
      range:
      - /mnt/in/a.exr
      - /mnt/in/b.exr
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print()
