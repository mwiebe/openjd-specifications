# RFC 0011 Design Choice 6 / §The Steps.* scope item 1: a transitive dependency is not
# enough; C depends on M, which depends on P, and C reads Steps.P.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
- name: M
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: C
  dependencies:
  - dependsOn: M
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.P.Output.N}})
