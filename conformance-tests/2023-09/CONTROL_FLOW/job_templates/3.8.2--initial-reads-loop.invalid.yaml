# RFC 0013 §<LoopVariableDefinition> item 3: initial may not reference Loop.*; there is no
# iteration yet.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables:
    - name: N
      type: INT
      initial: '{{Loop.Iteration}}'
      next: '{{1}}'
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
