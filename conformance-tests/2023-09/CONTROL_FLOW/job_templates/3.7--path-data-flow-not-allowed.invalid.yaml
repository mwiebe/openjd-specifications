# RFC 0011 §<OutputVariableDefinition>: dataFlow is not available on a PATH output.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: F
    type: PATH
    dataFlow: OUT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: F="/mnt/out/a.exr"')
