# RFC 0013 §<LoopOutputVariableDefinition> item 4: under APPEND the value has the element
# type; a list[int] value for a LIST[INT] output does not convert to int.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  outputVariables:
  - name: X
    type: LIST[INT]
    collect: APPEND
    value: '{{[1]}}'
