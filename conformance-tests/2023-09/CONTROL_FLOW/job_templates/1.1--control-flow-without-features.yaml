# RFC 0011 §Backward compatibility: listing CONTROL_FLOW (with ENV_PARAMS and EXPR) and
# using none of its features is valid; the Steps behave as they do without the extension.
# 1.1--control-flow-without-env-params is the same template without ENV_PARAMS.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
steps:
- name: A
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: B
  dependencies:
  - dependsOn: A
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
