# RFC 0011 §Backward compatibility: listing CONTROL_FLOW (with EXPR) and using none of
# its features is valid; the Steps behave as they do without the extension.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: A
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: B
  dependencies:
  - dependsOn: A
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
