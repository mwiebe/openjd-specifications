# RFC 0011 §<Environment> enableIf constraint 2: a Step Environment's enableIf may also
# reference Step.Name and the Steps.* symbols of the enclosing Step's direct dependencies.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: Go
    type: BOOL
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Go=true')
- name: C
  dependencies:
  - dependsOn: P
  stepEnvironments:
  - name: CEnv
    enableIf: '{{Steps.P.Output.Go and Step.Name == ''C''}}'
    variables:
      CF_VAR: set
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
