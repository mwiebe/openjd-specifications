# RFC 0013 §<StepLoop> item 6 constraint 3: no two loop outputs have the same name.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: 'true'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  outputVariables:
  - name: X
    type: INT
    collect: LAST
    value: '{{1}}'
  - name: X
    type: INT
    collect: LAST
    value: '{{2}}'
