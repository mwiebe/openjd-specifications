# RFC 0013 §<LoopDefinition> item 2 / §Validation item 10: while is an expression field
# of type bool (RFC 0010's Template Schemas §7.6 rule 1), written without {{ }}. A value
# written as a format string is a parse error, even though the expression inside it is a
# bool.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables:
    - name: N
      type: INT
      initial: '{{0}}'
      next: '{{Loop.N + 1}}'
    while: '{{Loop.N < 1}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
