# RFC 0010 §Reductions: a multi-Task producer's output is list[T] and reduces with the
# RFC 0006 functions.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  parameterSpace:
    taskParameterDefinitions:
    - name: F
      type: INT
      range:
      - 1
      - 2
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
- name: C
  let:
  - total = sum(Steps.P.Output.N)
  - lo = min(Steps.P.Output.N)
  - hi = max(Steps.P.Output.N)
  - k = len(Steps.P.Output.N)
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{total}}, {{lo}}, {{hi}}, {{k}})
