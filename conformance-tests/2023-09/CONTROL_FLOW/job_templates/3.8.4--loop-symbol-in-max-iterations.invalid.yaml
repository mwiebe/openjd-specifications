# RFC 0013 §The Loop.* scope, Where available item 3: Loop.* is not available in the loop's
# maxIterations.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables:
    - name: N
      type: INT
      initial: '{{0}}'
      next: '{{1}}'
    until: '{{true}}'
    maxIterations: '{{Loop.N + 1}}'
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
