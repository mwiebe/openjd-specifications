# RFC 0010 §<StepTemplate> enableIf constraint 2: may not reference names bound by the
# Step's own let (enableIf is evaluated before let).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: A
  enableIf: '{{run}}'
  let:
  - run = true
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
