# RFC 0010 §<OutputVariableDefinition> item 5: unit may not contain a Unicode Cc
# (control) character. This one contains a TAB.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
    unit: "m\tm"
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
