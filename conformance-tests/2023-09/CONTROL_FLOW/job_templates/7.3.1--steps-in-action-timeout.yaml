# RFC 0010 §The Steps.* scope, Where available item 3, and §Materialization expressions
# item 7: an action's timeout (a TEMPLATE-scope format string of the script, with
# FEATURE_BUNDLE_1) may read Steps.P.*; it is evaluated at C's step input binding.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- FEATURE_BUNDLE_1
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: Seconds
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Seconds=60')
- name: C
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        timeout: '{{Steps.P.Output.Seconds * 2}}'
        command: python
        args:
        - -c
        - |-
          print()
