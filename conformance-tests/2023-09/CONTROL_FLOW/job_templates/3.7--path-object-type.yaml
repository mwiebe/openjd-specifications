# RFC 0011 §<OutputVariableDefinition>: objectType is a constraint property of PATH and
# LIST[PATH] outputs (descriptive only).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: D
    type: PATH
    objectType: DIRECTORY
  - name: Fs
    type: LIST[PATH]
    objectType: FILE
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: D="/mnt/out"'); print('openjd_output_var: Fs=["/mnt/out/a.exr"]')
