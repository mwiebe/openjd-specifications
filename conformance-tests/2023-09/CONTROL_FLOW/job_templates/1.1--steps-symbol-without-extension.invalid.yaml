# RFC 0010 Technical Requirement 2: the Steps.* symbols exist only with CONTROL_FLOW.
# With EXPR alone, Steps.P.TaskParam.F is an unknown symbol.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: P
  parameterSpace:
    taskParameterDefinitions:
    - name: F
      type: INT
      range:
      - 1
      - 2
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: C
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.P.TaskParam.F}})
