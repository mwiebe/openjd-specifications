# RFC 0013 §Steps.* in and around a loop item 3: until, next, and a loop output value may
# read any body Step, including one that has dependents.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables:
    - name: N
      type: INT
      initial: '{{0}}'
      next: '{{Steps.A.Output.X}}'
    until: '{{Steps.A.Output.X > 0}}'
    maxIterations: 5
    steps:
    - name: A
      outputVariables:
      - name: X
        type: INT
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('openjd_output_var: X=1')
    - name: B
      dependencies:
      - dependsOn: A
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  outputVariables:
  - name: X
    type: INT
    collect: LAST
    value: '{{Steps.A.Output.X}}'
