# RFC 0011 §Validation item 10 and Open Question 16 (answered): template validation reports an
# error that it can compute in a Step's materialization expressions, whatever the Step's
# enableIf, a Step Environment's enableIf, and for a body Step the loop's enableIf and while.
# With FEATURE_BUNDLE_1, an action timeout of {{1 - 1}} resolves to 0, which is not a positive
# integer, wherever it is evaluated.
#
# CEnv's enableIf reads P's output, so C may never enter CEnv and its onEnter timeout is not
# evaluated at run time when CEnv is disabled (RFC 0011 §<Environment> item 4), and the
# timeout is still an error at template validation.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- FEATURE_BUNDLE_1
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: Go
    type: BOOL
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Go=true')
- name: C
  dependencies:
  - dependsOn: P
  stepEnvironments:
  - name: CEnv
    enableIf: Steps.P.Output.Go
    script:
      actions:
        onEnter:
          command: python
          timeout: '{{1 - 1}}'
          args:
          - -c
          - |-
            print('CE_' + 'IN')
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('C_' + 'RAN')
