# RFC 0011 §<StepTemplate> enableIf constraint 2: may not reference Task.*.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: A
  enableIf: '{{Task.Param.F > 1}}'
  parameterSpace:
    taskParameterDefinitions:
    - name: F
      type: INT
      range:
      - 1
      - 2
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
