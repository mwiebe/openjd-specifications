# RFC 0011 §<Environment> item 2: an environment: entry's parameters values may not reference
# Steps.*. C depends on P and supplies E's Pkg from P's output.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
jobEnvironments:
- name: E
  envParameterDefinitions:
  - name: Pkg
    type: STRING
    default: d
  script:
    actions:
      onEnter:
        command: python
        args:
        - -c
        - |-
          print('E_' + 'IN', '{{Env.Param.Pkg}}')
steps:
- name: P
  outputVariables:
  - name: Name
    type: STRING
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Name="a"')
- name: C
  dependencies:
  - dependsOn: P
  - environment: E
    parameters:
      Pkg: '{{Steps.P.Output.Name}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('C_' + 'RAN')
