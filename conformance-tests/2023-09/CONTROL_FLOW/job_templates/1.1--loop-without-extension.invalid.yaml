# RFC 0013 §Job Template: a <StepLoop> entry in steps is available only with CONTROL_FLOW.
# Without it, an element with a loop property is a malformed <StepTemplate>.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: L
  loop:
    until: 'true'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
