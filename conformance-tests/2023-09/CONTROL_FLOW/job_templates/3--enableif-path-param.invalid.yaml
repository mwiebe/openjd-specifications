# RFC 0010 §<StepTemplate> enableIf constraint 1: Param.* of a PATH parameter is excluded
# (available only on the worker host).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Scene
  type: PATH
  default: scene.ma
steps:
- name: A
  enableIf: '{{len(Param.Scene) > 0}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
