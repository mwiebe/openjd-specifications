# RFC 0010 §Validation item 2 / §Chunked Steps item 1: in a Step that declares
# outputVariables, a CHUNK[INT] range written as a literal list must have distinct values.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
- TASK_CHUNKING
name: TestJob
steps:
- name: P
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range:
      - 1
      - 2
      - 2
      - 3
      chunks:
        defaultTaskCount: 5
        rangeConstraint: NONCONTIGUOUS
  outputVariables:
  - name: T
    type: FLOAT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          for f in {{repr_py(list(Task.Param.Frame))}}: print('openjd_output_var: T[%d]=0.5' % f)
