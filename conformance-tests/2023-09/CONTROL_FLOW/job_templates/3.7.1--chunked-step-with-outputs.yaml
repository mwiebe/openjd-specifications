# RFC 0011 §Chunked Steps: a Step with a CHUNK[INT] parameter may declare outputVariables;
# each directive names its Task with a [<value>] selector.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
- TASK_CHUNKING
name: TestJob
steps:
- name: P
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range: 1-10
      chunks:
        defaultTaskCount: 5
        rangeConstraint: CONTIGUOUS
  outputVariables:
  - name: T
    type: FLOAT
    unit: s
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          for f in {{repr_py(list(Task.Param.Frame))}}: print('openjd_output_var: T[%d]=0.5' % f)
