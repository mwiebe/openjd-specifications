# RFC 0010 §<Environment> enableIf constraint 3: may not reference names bound by let,
# including the enclosing Step's let.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: S
  let:
  - use_env = true
  stepEnvironments:
  - name: SEnv
    enableIf: '{{use_env}}'
    variables:
      CF_VAR: set
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
