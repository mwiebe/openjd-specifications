# RFC 0011 §<OutputVariableDefinition> constraint 2: a constraint property must be valid
# for the declared type; minValue is not a STRING constraint.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: S
    type: STRING
    minValue: 1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: S="a"')
