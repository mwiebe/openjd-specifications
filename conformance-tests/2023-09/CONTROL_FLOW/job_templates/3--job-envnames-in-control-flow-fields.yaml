# RFC 0011 §<Environment> (the paragraph on Job.EnvNames), §<StepTemplate> enableIf and
# §<JobOutputDefinition>, and RFC 0013 §<LoopDefinition>: Job.EnvNames may be read by a
# Step's and a loop's enableIf, a loop's other expressions, and a job output's value.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
jobOutputDefinitions:
- name: HasE
  type: BOOL
  value: '{{''E'' in Job.EnvNames}}'
jobEnvironments:
- name: E
  variables:
    CF_E: '1'
steps:
- name: S
  enableIf: "'E' in Job.EnvNames"
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('S_' + 'RAN')
- name: L
  enableIf: len(Job.EnvNames) > 0
  loop:
    until: Loop.Iteration >= len(Job.EnvNames)
    maxIterations: 3
    steps:
    - name: B
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('B_' + 'RAN')
