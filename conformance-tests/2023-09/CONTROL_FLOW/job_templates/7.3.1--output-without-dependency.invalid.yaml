# RFC 0011 §The Steps.* scope, Where available item 1 / Validation item 4: a Step may
# read Steps.P.* only if it lists P in its own dependencies. A reference creates no edge.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
- name: C
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.P.Output.N}})
