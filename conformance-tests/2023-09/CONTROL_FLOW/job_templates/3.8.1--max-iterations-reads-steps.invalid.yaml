# RFC 0013 §<LoopDefinition> item 4: maxIterations may reference only Param.*, RawParam.*,
# and Job.Name, so that the bound is known at Job creation; not a dependency's output.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: Setup
  outputVariables:
  - name: Start
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Start=1')
- name: L
  dependencies:
  - dependsOn: Setup
  loop:
    until: 'true'
    maxIterations: '{{Steps.Setup.Output.Start}}'
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
