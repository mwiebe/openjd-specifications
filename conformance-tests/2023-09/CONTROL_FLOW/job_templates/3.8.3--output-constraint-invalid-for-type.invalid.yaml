# RFC 0013 §Validation item 6: a loop output's constraint properties are valid for its type,
# as for RFC 0012's outputVariables. minValue is not a STRING property.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: 'Loop.Iteration >= 0'
    maxIterations: 1
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('W_' + 'RAN')
  outputVariables:
  - name: S
    type: STRING
    collect: LAST
    value: '{{string(Loop.Iteration)}}'
    minValue: 0
