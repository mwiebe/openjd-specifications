# RFC 0010 §The Steps.* scope: for a PATH Task parameter, Steps.P.TaskParam is available
# only on the worker host; a step-level let must use TaskRawParam.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  parameterSpace:
    taskParameterDefinitions:
    - name: F
      type: PATH
      range:
      - /mnt/in/a
      - /mnt/in/b
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: C
  let:
  - ps = Steps.P.TaskParam.F
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{len(ps)}})
