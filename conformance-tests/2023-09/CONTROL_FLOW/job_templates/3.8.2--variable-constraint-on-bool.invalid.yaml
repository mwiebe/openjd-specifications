# RFC 0013 §Validation item 5: BOOL has no constraint properties, so a BOOL loop variable
# with allowedValues is invalid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables:
    - name: B
      type: BOOL
      initial: '{{true}}'
      next: '{{Loop.B}}'
      allowedValues:
      - true
    until: 'Loop.Iteration >= 0'
    maxIterations: 1
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('W_' + 'RAN')
