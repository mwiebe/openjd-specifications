# RFC 0013 §<LoopDefinition> item 3 / §Validation item 10: until has static type bool or
# bool?, with no implicit conversion (RFC 0010's Template Schemas §7.6 rule 2), so a STRING
# loop variable is an error whatever its value.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables:
    - name: Token
      type: STRING
      initial: '{{''a''}}'
      next: '{{''b''}}'
    until: 'Loop.Token'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
