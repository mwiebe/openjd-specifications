# RFC 0010 §<JobOutputDefinition> item 3: may not reference Param.* of a PATH parameter.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Out
  type: PATH
  default: out
jobOutputDefinitions:
- name: OutDir
  type: PATH
  value: '{{Param.Out}}'
steps:
- name: S
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
