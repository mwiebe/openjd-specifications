# RFC 0011 §<StepTemplate> enableIf: <bool> | <FormatString>; a YAML bool literal is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: A
  enableIf: true
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: B
  enableIf: false
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
