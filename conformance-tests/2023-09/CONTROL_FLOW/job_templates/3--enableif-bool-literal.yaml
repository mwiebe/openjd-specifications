# RFC 0011 §<StepTemplate> enableIf: an expression field of type bool, where a YAML bool
# literal is used as written (RFC 0010's Template Schemas §7.6 item 1).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: A
  enableIf: true
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: B
  enableIf: false
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
