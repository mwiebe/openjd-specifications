# RFC 0010 §<OutputVariableDefinition> item 3: collect LAST is valid on a scalar type.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: Done
    type: INT
    collect: LAST
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Done=1')
