# RFC 0011 §<Environment> item 2: an environment: entry's enableIf may not reference Steps.*
# through a let binding either. C's binding go reads P's output, and its entry for E has the
# enableIf go. RFC 0010 lets an entry's enableIf read the Step's let (Template Schemas §7.3.2),
# so only the Steps.* behind it makes this invalid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
jobEnvironments:
- name: E
  envParameterDefinitions:
  - name: Pkg
    type: STRING
    default: d
  script:
    actions:
      onEnter:
        command: python
        args:
        - -c
        - |-
          print('E_' + 'IN', '{{Env.Param.Pkg}}')
steps:
- name: P
  outputVariables:
  - name: Go
    type: BOOL
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Go=true')
- name: C
  dependencies:
  - dependsOn: P
  - environment: E
    enableIf: go
  let:
  - go = Steps.P.Output.Go
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('C_' + 'RAN')
