# RFC 0013 §<LoopDefinition> variables constraint 1: if provided, variables has at least
# one element.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables: []
    until: '{{Loop.Iteration >= 0}}'
    maxIterations: 1
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('W_' + 'RAN')
