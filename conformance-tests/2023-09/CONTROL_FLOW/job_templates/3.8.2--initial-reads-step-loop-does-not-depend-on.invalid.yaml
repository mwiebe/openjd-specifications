# RFC 0013 §<LoopVariableDefinition> item 3 / §Steps.* in and around a loop item 2: initial
# reads only the Steps the loop lists in its dependencies.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: Setup
  outputVariables:
  - name: Start
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Start=1')
- name: L
  loop:
    variables:
    - name: N
      type: INT
      initial: '{{Steps.Setup.Output.Start}}'
      next: '{{1}}'
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
