# RFC 0011 §<OutputVariableDefinition>: collect is an <OutputCollectMode>
# (ONCE | LAST | APPEND).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
    collect: FIRST
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
