# RFC 0011 §<Environment> item 1 and RFC 0013 §The Loop.* scope: in a body Step of a loop, a
# Step Environment's enableIf may also read Loop.*. BEnv is entered after the first iteration.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: Loop.Iteration >= 1
    maxIterations: 3
    steps:
    - name: B
      stepEnvironments:
      - name: BEnv
        enableIf: Loop.Iteration > 0
        variables:
          CF_B: '1'
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('B_' + 'RAN')
