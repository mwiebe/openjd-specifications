# RFC 0011 §<Environment> enableIf constraint 1: a Job Environment's enableIf may reference
# only Param.*, RawParam.*, and Job.Name; Step.Name is for Step Environments.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
jobEnvironments:
- name: E
  enableIf: '{{Step.Name == ''S''}}'
  variables:
    CF_VAR: set
steps:
- name: S
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
