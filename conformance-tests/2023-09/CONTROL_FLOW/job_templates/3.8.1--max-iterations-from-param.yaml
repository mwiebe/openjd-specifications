# RFC 0013 §<LoopDefinition> item 4: maxIterations may be a format string over Param.*.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Max
  type: INT
  default: 3
steps:
- name: L
  loop:
    until: 'true'
    maxIterations: '{{Param.Max}}'
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
