# RFC 0013 §<LoopDefinition> item 2: while may not reference the body's Steps; state that a
# while condition needs is carried in a loop variable.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    while: '{{Steps.W.Output.More}}'
    maxIterations: 5
    steps:
    - name: W
      outputVariables:
      - name: More
        type: BOOL
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('openjd_output_var: More=false')
