# RFC 0011 §<OutputVariableDefinition> item 2: RANGE_EXPR is an <OutputVariableType>.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: V
    type: RANGE_EXPR
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: V="1-10"')
