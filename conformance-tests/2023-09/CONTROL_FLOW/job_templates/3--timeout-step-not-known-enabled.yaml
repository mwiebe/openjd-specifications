# RFC 0011 §Validation item 10 and Open Question 16 (answered): template validation reports an
# error that it can compute in a Step's materialization expressions, whatever the Step's
# enableIf, a Step Environment's enableIf, and for a body Step the loop's enableIf and while.
# With FEATURE_BUNDLE_1, an action timeout of {{1 - 1}} resolves to 0, which is not a positive
# integer, wherever it is evaluated.
#
# The companion of 3--timeout-error-step-not-known-enabled: the same template with a timeout
# of {{1 + 1}} is valid, so a validator that rejected a computed timeout in a conditional Step
# for another reason fails it.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- FEATURE_BUNDLE_1
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Run
  type: BOOL
  default: true
steps:
- name: S
  enableIf: Param.Run
  script:
    actions:
      onRun:
        command: python
        timeout: '{{1 + 1}}'
        args:
        - -c
        - |-
          print('S_' + 'RAN')
