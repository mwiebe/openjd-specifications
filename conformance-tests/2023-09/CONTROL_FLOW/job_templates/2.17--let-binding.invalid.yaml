# RFC 0011 §<JobOutputDefinition> item 3: may not reference names bound by let.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
jobOutputDefinitions:
- name: X
  type: INT
  value: '{{x}}'
steps:
- name: S
  let:
  - x = 1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{x}})
