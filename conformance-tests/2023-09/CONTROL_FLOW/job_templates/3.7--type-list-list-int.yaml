# RFC 0011 §<OutputVariableDefinition> item 2: LIST[LIST[INT]] is an <OutputVariableType>.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: V
    type: LIST[LIST[INT]]
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: V=[[1], []]')
