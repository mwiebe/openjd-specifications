# RFC 0011 Design Choice 6 / §<JobOutputDefinition> item 3: a job output's value may read
# the Steps.* of any Step; no dependency is needed (or possible).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
jobOutputDefinitions:
- name: Total
  type: INT
  value: '{{Steps.P.Output.N + Steps.Q.Output.M}}'
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
- name: Q
  outputVariables:
  - name: M
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: M=2')
