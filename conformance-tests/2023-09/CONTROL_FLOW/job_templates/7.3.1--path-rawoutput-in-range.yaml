# RFC 0010 §The Steps.* scope: a PATH Task parameter range may come from RawOutput; its
# Task.Param values are then mapped forward on the worker host.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: F
    type: PATH
  - name: Fs
    type: LIST[PATH]
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: F="/mnt/out/a.exr"'); print('openjd_output_var: Fs=["/mnt/out/a.exr"]')
- name: C
  dependencies:
  - dependsOn: P
  parameterSpace:
    taskParameterDefinitions:
    - name: D
      type: PATH
      range: '{{Steps.P.RawOutput.Fs}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{repr_py(Task.Param.D)}})
