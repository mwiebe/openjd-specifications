# RFC 0013 §<LoopOutputVariableDefinition> item 3 / Design Choice 8: a loop output's collect
# is LAST or APPEND; ONCE is not allowed.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  outputVariables:
  - name: X
    type: INT
    collect: ONCE
    value: '{{1}}'
