# RFC 0011 §<Environment> enableIf constraint 1 / §The Steps.* scope: a Job Environment's
# enableIf may not reference Steps.* (it is evaluated at Job creation).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
jobEnvironments:
- name: E
  enableIf: '{{Steps.P.Output.Go}}'
  variables:
    CF_VAR: set
steps:
- name: P
  outputVariables:
  - name: Go
    type: BOOL
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Go=true')
