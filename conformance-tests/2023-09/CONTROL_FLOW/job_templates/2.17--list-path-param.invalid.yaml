# RFC 0011 §<JobOutputDefinition> item 3: may not reference Param.* of a LIST[PATH]
# parameter (RawParam.* is the submission-context form).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Outs
  type: LIST[PATH]
  default:
  - out/a
  - out/b
jobOutputDefinitions:
- name: OutDirs
  type: LIST[PATH]
  value: '{{Param.Outs}}'
steps:
- name: S
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
