# RFC 0011 §<StepTemplate> enableIf constraint 1: may reference RawParam.* even for a PATH
# parameter.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Scene
  type: PATH
  default: scene.ma
steps:
- name: A
  enableIf: '{{len(RawParam.Scene) > 0}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
