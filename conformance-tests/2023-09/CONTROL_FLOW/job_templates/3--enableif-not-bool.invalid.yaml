# RFC 0010 §Validation item 7: enableIf has type bool. An int has no implicit conversion
# to bool.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: N
  type: INT
  default: 1
steps:
- name: A
  enableIf: '{{Param.N}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
