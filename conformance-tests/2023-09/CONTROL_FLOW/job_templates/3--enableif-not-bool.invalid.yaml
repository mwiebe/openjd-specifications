# RFC 0011 §Validation item 6: enableIf is an expression field of type bool. An int
# expression does not fit bool, and has no implicit conversion to it (RFC 0010's Template
# Schemas §7.6 rule 2).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: N
  type: INT
  default: 1
steps:
- name: A
  enableIf: 'Param.N'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
