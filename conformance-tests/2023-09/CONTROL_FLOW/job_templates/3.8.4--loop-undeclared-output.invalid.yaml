# RFC 0013 §Steps.* in and around a loop item 5: Steps.<Loop>.Output.<VarName> names a
# declared loop output.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  outputVariables:
  - name: X
    type: INT
    collect: LAST
    value: '{{1}}'
- name: C
  dependencies:
  - dependsOn: L
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.L.Output.Y}})
