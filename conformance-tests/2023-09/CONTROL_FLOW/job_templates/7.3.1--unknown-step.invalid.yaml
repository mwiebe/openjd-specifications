# RFC 0010 §Validation item 3: Steps.<StepName> must name a Step of the Job.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
- name: C
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.Q.Output.N}})
