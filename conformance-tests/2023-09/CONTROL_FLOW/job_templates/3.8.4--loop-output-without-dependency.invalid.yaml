# RFC 0011 §The Steps.* scope, Where available item 1 / RFC 0013 §Steps.* in and around a loop
# item 4: a Step reads a loop's outputs only if it lists the loop in its dependencies.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: 'true'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
  outputVariables:
  - name: X
    type: INT
    collect: LAST
    value: '{{1}}'
- name: C
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.L.Output.X}})
