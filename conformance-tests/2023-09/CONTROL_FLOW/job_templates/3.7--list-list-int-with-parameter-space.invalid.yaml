# RFC 0010 §<OutputVariableDefinition> constraint 1: LIST[LIST[INT]] may only be declared
# by a Step without a parameterSpace (a multi-Task producer's value would nest 3 deep).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  parameterSpace:
    taskParameterDefinitions:
    - name: F
      type: INT
      range:
      - 1
      - 2
  outputVariables:
  - name: G
    type: LIST[LIST[INT]]
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: G=[[1]]')
