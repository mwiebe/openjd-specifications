# RFC 0011 §The Steps.* scope, Where available item 2: <StepName> is not the referencing
# Step itself.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1'); print({{Steps.P.Output.N}})
