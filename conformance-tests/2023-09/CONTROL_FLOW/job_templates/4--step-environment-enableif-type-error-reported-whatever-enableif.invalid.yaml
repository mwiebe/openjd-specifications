# RFC 0011 §<Environment> item 3 ("Before Job creation" bullet) and §Validation item 10: an
# error in an Environment's enableIf itself is reported whatever any enableIf. SEnv's enableIf
# reads the INT parameter N, whose type is not bool (RFC 0010's Template Schemas §7.6 rule 2),
# in a Step whose enableIf is Param.Run.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Run
  type: BOOL
  default: true
- name: N
  type: INT
  default: 1
steps:
- name: S
  enableIf: Param.Run
  stepEnvironments:
  - name: SEnv
    enableIf: Param.N
    variables:
      CF_S: '1'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('S_' + 'RAN')
