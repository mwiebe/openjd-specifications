# RFC 0010 §<OutputVariableDefinition> item 2: LIST[PATH] is an <OutputVariableType>.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: V
    type: LIST[PATH]
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: V=["/mnt/out/a.exr"]')
