# RFC 0012 §<OutputVariableDefinition> item 2 table: each of the 12 types accepts every
# constraint property of the job parameter definition of the same type (BOOL has none).
# P has no parameterSpace, so LIST[LIST[INT]] is allowed. The template is only checked,
# not run.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: I
    type: INT
    allowedValues:
    - 1
    - 2
    minValue: 0
    maxValue: 10
  - name: F
    type: FLOAT
    allowedValues:
    - 0.5
    - 1.5
    minValue: 0.0
    maxValue: 2.0
  - name: S
    type: STRING
    allowedValues:
    - a
    - b
    minLength: 1
    maxLength: 8
  - name: Pa
    type: PATH
    objectType: FILE
    allowedValues:
    - /a
    - /b
    minLength: 1
    maxLength: 100
  - name: B
    type: BOOL
  - name: R
    type: RANGE_EXPR
    minLength: 1
    maxLength: 100
  - name: LI
    type: LIST[INT]
    minLength: 1
    maxLength: 4
    item:
      allowedValues:
      - 1
      - 2
      minValue: 0
      maxValue: 9
  - name: LF
    type: LIST[FLOAT]
    minLength: 1
    maxLength: 4
    item:
      allowedValues:
      - 0.5
      - 1.5
      minValue: 0.0
      maxValue: 2.0
  - name: LS
    type: LIST[STRING]
    minLength: 1
    maxLength: 4
    item:
      allowedValues:
      - a
      - b
      minLength: 1
      maxLength: 8
  - name: LP
    type: LIST[PATH]
    objectType: DIRECTORY
    minLength: 1
    maxLength: 4
    item:
      allowedValues:
      - /a
      - /b
      minLength: 1
      maxLength: 100
  - name: LB
    type: LIST[BOOL]
    minLength: 1
    maxLength: 3
  - name: LL
    type: LIST[LIST[INT]]
    minLength: 1
    maxLength: 4
    item:
      minLength: 1
      maxLength: 3
      item:
        allowedValues:
        - 1
        - 2
        minValue: 0
        maxValue: 9
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          for d in ['I=1', 'F=0.5', 'S="a"', 'Pa="/a"', 'B=true', 'R="1-3"', 'LI=[1]', 'LF=[0.5]', 'LS=["a"]', 'LP=["/a"]', 'LB=[true]', 'LL=[[1]]']: print('openjd_output_var: ' + d)
