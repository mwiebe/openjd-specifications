# RFC 0011 §<OutputVariableDefinition> item 2 table: each type accepts the constraint
# properties of the job parameter definition of the same type.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: I
    type: INT
    minValue: 0
    maxValue: 10
  - name: F
    type: FLOAT
    allowedValues:
    - 0.5
    - 1.5
  - name: S
    type: STRING
    minLength: 1
    maxLength: 8
    allowedValues:
    - a
    - b
  - name: R
    type: RANGE_EXPR
    minLength: 1
    maxLength: 100
  - name: L
    type: LIST[INT]
    minLength: 1
    maxLength: 4
    item:
      minValue: 0
      maxValue: 9
  - name: B
    type: LIST[BOOL]
    maxLength: 3
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: I=1'); print('openjd_output_var: F=0.5'); print('openjd_output_var: S="a"'); print('openjd_output_var: R="1-3"'); print('openjd_output_var: L=[1]'); print('openjd_output_var: B=[true]')
