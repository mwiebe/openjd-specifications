# RFC 0011 §<Environment> item 3 ("What stays at Job creation", "A SKIPPED Step" and "Before
# Job creation" bullets) and RFC 0010's Template Schemas §4 item 4: an ALWAYS Environment
# whose enableIf is known to be false before Job creation is an error in the Environment's
# definition, reported whatever any Step's enableIf.
#
# Lic's enableIf is Param.F and false, known to be false, and the only Step, S, has the enableIf
# Param.F, so S is not known to be enabled, and the Environment is still an error.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: F
  type: BOOL
  default: true
jobEnvironments:
- name: Lic
  activation: ALWAYS
  enableIf: Param.F and false
  variables:
    CF_LIC: '1'
steps:
- name: S
  enableIf: Param.F
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('S_' + 'RAN')
