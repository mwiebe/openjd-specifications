# RFC 0011 §The Steps.* scope: a PATH Steps.P.Output is available in format strings
# resolved on the worker host, such as an action's args.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: F
    type: PATH
  - name: Fs
    type: LIST[PATH]
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: F="/mnt/out/a.exr"'); print('openjd_output_var: Fs=["/mnt/out/a.exr"]')
- name: C
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{repr_py(Steps.P.Output.F)}}, {{repr_py(Steps.P.Output.Fs)}})
