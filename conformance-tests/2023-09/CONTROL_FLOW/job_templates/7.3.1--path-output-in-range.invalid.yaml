# RFC 0011 §The Steps.* scope: a parameterSpace range is a materialization expression,
# not resolved on the worker host, so it may not read a LIST[PATH] Steps.P.Output.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: F
    type: PATH
  - name: Fs
    type: LIST[PATH]
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: F="/mnt/out/a.exr"'); print('openjd_output_var: Fs=["/mnt/out/a.exr"]')
- name: C
  dependencies:
  - dependsOn: P
  parameterSpace:
    taskParameterDefinitions:
    - name: D
      type: PATH
      range: '{{Steps.P.Output.Fs}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{repr_py(Task.Param.D)}})
