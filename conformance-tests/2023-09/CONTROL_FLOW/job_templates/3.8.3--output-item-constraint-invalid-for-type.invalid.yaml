# RFC 0013 §Validation item 6: item constraints are those of the element type. minLength
# is not an INT property, so it is invalid in the item of a LIST[INT] loop output.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: 'Loop.Iteration >= 0'
    maxIterations: 1
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('W_' + 'RAN')
  outputVariables:
  - name: H
    type: LIST[INT]
    collect: APPEND
    value: '{{Loop.Iteration}}'
    item:
      minLength: 1
