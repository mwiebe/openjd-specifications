# RFC 0010 Design Choice 5 / §The Steps.* scope: a Step whose name is not an <Identifier>
# is still valid, including as a dependency; it just can't be referenced through Steps.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: Find Frames
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
- name: C
  dependencies:
  - dependsOn: Find Frames
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
