# RFC 0011 §The Steps.* scope, Where available item 1, with RFC 0010's Template Schemas §3.2
# item 2: a step: entry means exactly what a dependsOn: entry means, so a Step that names P in
# a step: entry is a direct dependent of P and may read Steps.P.*. C reads P's output in its
# enableIf and its script, and loop L names P in a step: entry and reads it in initial.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=7')
- name: C
  enableIf: Steps.P.Output.N > 0
  dependencies:
  - step: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('C_' + 'RAN', {{Steps.P.Output.N}})
- name: L
  dependencies:
  - step: P
  loop:
    variables:
    - name: V
      type: INT
      initial: '{{Steps.P.Output.N}}'
      next: '{{Loop.V + 1}}'
    until: Loop.V >= 8
    maxIterations: 3
    steps:
    - name: B
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('B_' + 'RAN')
