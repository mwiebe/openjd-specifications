# RFC 0013 §<StepLoop> and §<LoopDefinition>: a loop with variables, an until condition, a
# two-Step body, and LAST and APPEND outputs, read by a Step after it and a job output.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
jobOutputDefinitions:
- name: Passes
  type: INT
  value: '{{len(Steps.L.Output.History)}}'
steps:
- name: Setup
  outputVariables:
  - name: Start
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Start=1')
- name: L
  dependencies:
  - dependsOn: Setup
  loop:
    variables:
    - name: N
      type: INT
      initial: '{{Steps.Setup.Output.Start}}'
      next: '{{Loop.N + 1}}'
    until: 'Steps.Check.Output.Score >= 3'
    maxIterations: 10
    steps:
    - name: Work
      outputVariables:
      - name: Value
        type: INT
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('openjd_output_var: Value=' + str({{Loop.N}}))
    - name: Check
      dependencies:
      - dependsOn: Work
      outputVariables:
      - name: Score
        type: INT
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('openjd_output_var: Score=' + str({{Steps.Work.Output.Value}}))
  outputVariables:
  - name: Final
    type: INT
    collect: LAST
    value: '{{Steps.Check.Output.Score}}'
  - name: History
    type: LIST[INT]
    collect: APPEND
    value: '{{Steps.Check.Output.Score}}'
- name: C
  dependencies:
  - dependsOn: L
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.L.Output.Final + sum(Steps.L.Output.History)}})
