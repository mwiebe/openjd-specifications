# RFC 0013 §Steps.* in and around a loop item 1: a body Step reads the Steps.* symbols of the
# Steps the loop depends on, with no dependency of its own.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: Setup
  outputVariables:
  - name: Start
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Start=1')
- name: L
  dependencies:
  - dependsOn: Setup
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print({{Steps.Setup.Output.Start}})
