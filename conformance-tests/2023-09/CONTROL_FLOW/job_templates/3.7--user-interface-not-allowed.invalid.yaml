# RFC 0010 §<OutputVariableDefinition> item 6: the userInterface property of job
# parameter definitions is not available.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: N
    type: INT
    userInterface:
      control: SPIN_BOX
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
