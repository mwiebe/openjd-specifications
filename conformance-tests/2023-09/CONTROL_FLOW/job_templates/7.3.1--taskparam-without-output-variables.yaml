# RFC 0011 §Terminology, Producer: any Step with a parameterSpace can be a producer of
# Steps.*.TaskParam, whether or not it declares outputVariables.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  parameterSpace:
    taskParameterDefinitions:
    - name: F
      type: INT
      range:
      - 1
      - 2
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: C
  let:
  - total = sum(Steps.P.TaskParam.F)
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.P.TaskParam.F}})
