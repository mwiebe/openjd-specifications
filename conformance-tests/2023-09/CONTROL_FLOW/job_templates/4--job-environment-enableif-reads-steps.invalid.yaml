# RFC 0011 §<Environment> item 1: no field that RFC 0010 adds gains a scope other than a Step
# Environment's enableIf, so a Job Environment's enableIf reads no Steps.* (it is decided per
# Step from values concrete at Job creation, item 2).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
jobEnvironments:
- name: E
  enableIf: Steps.P.Output.Go
  variables:
    CF_VAR: '1'
steps:
- name: P
  outputVariables:
  - name: Go
    type: BOOL
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Go=true')
