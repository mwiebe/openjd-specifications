# RFC 0011 §Validation item 6: a Step's enableIf has static type bool or bool?, with no
# implicit conversion (RFC 0010's Template Schemas §7.6 rule 2). A STRING parameter is an
# error whatever its value, here the text 'true'. 3--enableif-string-compared is the valid
# companion that compares the same parameter.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Mode
  type: STRING
  default: 'true'
steps:
- name: A
  enableIf: 'Param.Mode'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
