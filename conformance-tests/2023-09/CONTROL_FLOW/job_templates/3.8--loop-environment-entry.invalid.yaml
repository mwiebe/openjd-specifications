# RFC 0013 §Validation item 4 and RFC 0011 §<Environment>: a loop has no Sessions, so its
# dependencies may not have an environment: entry. E is a valid BY_DEFAULT Job Environment.
# 4--body-step-entry is the valid companion, where a body Step of the loop has the entry.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
jobEnvironments:
- name: E
  envParameterDefinitions:
  - name: Pkg
    type: STRING
    default: d
  script:
    actions:
      onEnter:
        command: python
        args:
        - -c
        - |-
          print('E_' + 'IN', '{{Env.Param.Pkg}}')
steps:
- name: L
  dependencies:
  - environment: E
  loop:
    until: Loop.Iteration >= 1
    maxIterations: 3
    steps:
    - name: B
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('B_' + 'RAN')
