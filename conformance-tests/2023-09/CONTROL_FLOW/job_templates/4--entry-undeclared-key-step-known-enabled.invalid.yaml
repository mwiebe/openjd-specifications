# RFC 0011 §<Environment> item 3 ("Before Job creation" bullet) and RFC 0010's Template Schemas
# §3.2 constraints 5 and 6: an enabled entry's keys and values are checked before Job creation
# only for a Step known to be enabled. E's Pkg allows a and b.
#
# S's entry supplies Other, which E does not declare, and S's enableIf is Param.F or true,
# so S is known to be enabled and the key is an error at template validation.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: F
  type: BOOL
  default: true
jobEnvironments:
- name: E
  envParameterDefinitions:
  - name: Pkg
    type: STRING
    allowedValues:
    - a
    - b
    default: a
  script:
    actions:
      onEnter:
        command: python
        args:
        - -c
        - |-
          print('E_' + 'IN', '{{Env.Param.Pkg}}')
steps:
- name: S
  enableIf: Param.F or true
  dependencies:
  - environment: E
    parameters:
      Other: x
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('S_' + 'RAN')
