# RFC 0013 §<LoopDefinition> item 5 constraint 3: a body Step's dependencies name only Steps
# of the same body. The loop itself depends on Setup.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: Setup
  outputVariables:
  - name: Start
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Start=1')
- name: L
  dependencies:
  - dependsOn: Setup
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: W
      dependencies:
      - dependsOn: Setup
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
