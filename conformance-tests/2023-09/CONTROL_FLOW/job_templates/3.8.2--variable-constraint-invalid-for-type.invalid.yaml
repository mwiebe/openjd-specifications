# RFC 0013 §Validation item 5: a loop variable's constraint properties are valid for its
# type, as on the job parameter definition of that type. minValue is not a STRING property.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    variables:
    - name: S
      type: STRING
      initial: '{{''a''}}'
      next: '{{Loop.S}}'
      minValue: 0
    until: 'Loop.Iteration >= 0'
    maxIterations: 1
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('W_' + 'RAN')
