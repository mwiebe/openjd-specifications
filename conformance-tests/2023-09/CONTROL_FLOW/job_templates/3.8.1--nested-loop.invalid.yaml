# RFC 0013 §<LoopDefinition> item 5 constraint 2: a body contains only <StepTemplate>s; loops
# do not nest.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: Outer
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: Inner
      loop:
        until: '{{true}}'
        maxIterations: 5
        steps:
        - name: W
          script:
            actions:
              onRun:
                command: python
                args:
                - -c
                - |-
                  print('IT' + '_' + str({{Loop.Iteration}}))
