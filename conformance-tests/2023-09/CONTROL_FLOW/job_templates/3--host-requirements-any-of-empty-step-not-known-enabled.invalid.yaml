# RFC 0011 §Validation item 10 and §<Environment> item 5, with RFC 0010's Template Schemas
# §3.3 item 3: an anyOf of a Step's own hostRequirements that resolves to no values is an
# error in the Step's own field, and is reported whatever any enableIf. S's anyOf is one
# expression over literals whose result is an empty list, so it is known at template
# validation, and S's enableIf is Param.Run, so S may be skipped.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- ENV_PARAMS
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Run
  type: BOOL
  default: true
steps:
- name: S
  enableIf: Param.Run
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: '{{ [f for f in [''a''] if f != ''a''] }}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('S_' + 'RAN')
