# RFC 0011 §<StepTemplate> enableIf constraint 1: may reference Job.Name and Step.Name.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: A
  enableIf: '{{Step.Name == ''A'' and len(Job.Name) > 0}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
