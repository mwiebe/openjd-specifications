# RFC 0011 §Extension name and dependencies and Design Choice 13 (Template Schemas §1.1 item
# 3): a template that lists CONTROL_FLOW must also list ENV_PARAMS. This one lists EXPR and
# CONTROL_FLOW and uses no feature of either, so only the missing ENV_PARAMS can reject it.
# 1.1--control-flow-without-features is the same template with ENV_PARAMS, and is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: A
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
- name: B
  dependencies:
  - dependsOn: A
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
