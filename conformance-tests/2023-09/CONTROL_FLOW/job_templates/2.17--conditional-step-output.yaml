# RFC 0011 §<JobOutputDefinition> item 3: the value's target type is made optional, so it
# may read a conditional Step's T? output directly.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
parameterDefinitions:
- name: Run
  type: BOOL
  default: true
jobOutputDefinitions:
- name: N
  type: INT
  value: '{{Steps.P.Output.N}}'
steps:
- name: P
  enableIf: '{{Param.Run}}'
  outputVariables:
  - name: N
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: N=1')
