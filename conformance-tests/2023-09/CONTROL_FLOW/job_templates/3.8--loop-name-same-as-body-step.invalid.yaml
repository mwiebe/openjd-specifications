# RFC 0013 §Job Template constraint 1: a loop's name may not be the name of one of its body
# Steps.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: 'true'
    maxIterations: 5
    steps:
    - name: L
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('IT' + '_' + str({{Loop.Iteration}}))
