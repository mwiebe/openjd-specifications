# RFC 0013 §Steps.* in and around a loop item 4 / Design Choice 7: a Step after the loop reads
# only the loop's declared outputs, never a body Step, even though it depends on the loop.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: L
  loop:
    until: '{{true}}'
    maxIterations: 5
    steps:
    - name: A
      outputVariables:
      - name: X
        type: INT
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print('openjd_output_var: X=1')
- name: C
  dependencies:
  - dependsOn: L
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print({{Steps.A.Output.X}})
