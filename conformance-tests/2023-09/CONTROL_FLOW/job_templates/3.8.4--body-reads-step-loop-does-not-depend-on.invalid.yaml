# RFC 0013 §Steps.* in and around a loop item 1: a body Step may read a Step outside the body
# only if the loop lists it in its dependencies.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: Setup
  outputVariables:
  - name: Start
    type: INT
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Start=1')
- name: L
  loop:
    until: 'true'
    maxIterations: 5
    steps:
    - name: W
      script:
        actions:
          onRun:
            command: python
            args:
            - -c
            - |-
              print({{Steps.Setup.Output.Start}})
