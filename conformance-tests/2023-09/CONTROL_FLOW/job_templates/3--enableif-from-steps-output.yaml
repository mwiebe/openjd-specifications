# RFC 0010 §<StepTemplate> enableIf constraint 1: may reference the Steps.* symbols of a
# direct dependency (dynamic enableIf, decided at step input binding).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: P
  outputVariables:
  - name: Go
    type: BOOL
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('openjd_output_var: Go=true')
- name: C
  enableIf: '{{Steps.P.Output.Go}}'
  dependencies:
  - dependsOn: P
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
