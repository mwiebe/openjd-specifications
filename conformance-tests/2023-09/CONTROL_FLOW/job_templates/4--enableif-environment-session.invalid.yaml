# RFC 0010 §<Environment> enableIf constraint 3: may not reference Session.*.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- CONTROL_FLOW
name: TestJob
steps:
- name: S
  stepEnvironments:
  - name: SEnv
    enableIf: '{{Session.HasPathMappingRules}}'
    variables:
      CF_VAR: set
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |-
          print('ok')
