# RFC 0011 §The Steps.* scope: Steps.* is not available anywhere in an Environment
# Template. An Environment Template can't list CONTROL_FLOW, so this rule and extension
# gating give the same result and no template can tell them apart.
# jobs/7.3.1--steps-symbol-in-environment-template-with-control-flow-job checks that a Job's
# CONTROL_FLOW doesn't make Steps.* available to the Environment Templates used with it.
specificationVersion: environment-2023-09
extensions:
- EXPR
environment:
  name: Env
  script:
    actions:
      onEnter:
        command: python
        args:
        - -c
        - |-
          print({{Steps.P.Output.N}})
