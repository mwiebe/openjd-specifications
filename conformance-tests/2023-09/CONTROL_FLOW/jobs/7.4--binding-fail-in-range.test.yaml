# RFC 0010 §What binding does item 4: a fail(...) in a range at binding fails the Step
# before any of its Tasks runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: N
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: N=0')
  - name: C
    dependencies:
    - dependsOn: P
    parameterSpace:
      taskParameterDefinitions:
      - name: F
        type: INT
        range: '{{range(Steps.P.Output.N) if Steps.P.Output.N > 0 else fail(''no items'')}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_TAS' + 'K_RAN')
expected:
  taskFailure: {}
  forbidden:
  - C_TASK_RAN
