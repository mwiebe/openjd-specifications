# RFC 0010 §Materialization groups item 3: hostRequirements that read Steps.* are
# evaluated at C's step input binding. The computed requirement is at least 1 vCPU, which
# every host meets. C's marker shows that binding succeeded and C ran.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - FEATURE_BUNDLE_1
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: N
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: N=1')
  - name: C
    dependencies:
    - dependsOn: P
    hostRequirements:
      amounts:
      - name: amount.worker.vcpu
        min: '{{Steps.P.Output.N}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  output:
  - C_RAN
