# RFC 0013 §Steps.* in and around a loop item 1: every iteration's body Step instance reads
# the output of a Step the loop depends on.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: Setup
    outputVariables:
    - name: Base
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: Base=5')
  - name: L
    dependencies:
    - dependsOn: Setup
    loop:
      until: '{{Loop.Iteration >= 1}}'
      maxIterations: 5
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('W_' + str({{Steps.Setup.Output.Base + Loop.Iteration}}))
expected:
  output:
  - W_5
  - W_6
