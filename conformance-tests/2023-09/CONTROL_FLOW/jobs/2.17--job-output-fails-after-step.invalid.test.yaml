# RFC 0011 §Job outputs items 1 and 3: a job output is evaluated when the Step it reads
# succeeds; if it fails then, the Job fails.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  jobOutputDefinitions:
  - name: Small
    type: INT
    value: '{{Steps.P.Output.N if Steps.P.Output.N < 3 else fail(''N too large'')}}'
  steps:
  - name: P
    outputVariables:
    - name: N
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: N=5')
  - name: L
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print()
