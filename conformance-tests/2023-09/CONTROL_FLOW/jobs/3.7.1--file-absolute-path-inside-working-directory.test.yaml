# RFC 0010 §File values items 1-2: an absolute <FilePath> is used as written, and is valid
# when it names a regular file inside the Session's Working Directory.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[STRING]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json, os
            with open('v.json', 'w') as f: json.dump(['alpha'], f)
            print('openjd_output_var: V=@' + os.path.abspath('v.json'))
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.V))}})))
expected:
  output:
  - GOT:["alpha"]
