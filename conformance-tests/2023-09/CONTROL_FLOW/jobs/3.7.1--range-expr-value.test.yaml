# RFC 0011 Type conversion table: RANGE_EXPR R="1-10:2" gives the range_expr 1-10:2.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: RANGE_EXPR
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V="1-10:2"')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(list(Steps.P.Output.V)))}})))
expected:
  output:
  - GOT:[1, 3, 5, 7, 9]
