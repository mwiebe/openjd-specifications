# RFC 0011 Type conversion table / Design Choice 3: under APPEND a list value is one
# element of a LIST[LIST[INT]], never a batch: G=[1] then G=[] gives [[1], []].
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[LIST[INT]]
      collect: APPEND
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=[1]'); print('openjd_output_var: V=[]')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.V))}})))
expected:
  output:
  - GOT:[[1], []]
