# RFC 0013 §Iterations item 4: a body Step instance skipped by its enableIf counts as complete,
# so the iteration ends and the loop continues; in the iterations where it is skipped, its
# outputs are null at the boundary.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      until: 'Loop.Iteration >= 2'
      maxIterations: 10
      steps:
      - name: S
        enableIf: 'Loop.Iteration == 1'
        outputVariables:
        - name: X
          type: INT
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('S_' + str({{Loop.Iteration}})); print('openjd_output_var: X=7')
    outputVariables:
    - name: Xs
      type: LIST[INT]
      collect: APPEND
      value: '{{Steps.S.Output.X or -1}}'
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.L.Output.Xs))}})))
expected:
  output:
  - S_1
  - GOT:[-1, 7, -1]
  forbidden:
  - S_0
  - S_2
