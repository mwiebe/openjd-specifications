# RFC 0010 §Chunked Steps item 2: ONCE applies per Task; reporting X[1] twice is invalid.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  - TASK_CHUNKING
  name: TestJob
  steps:
  - name: P
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: CHUNK[INT]
        range: 1-2
        chunks:
          defaultTaskCount: 2
          rangeConstraint: CONTIGUOUS
    outputVariables:
    - name: X
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            for f in {{repr_py(list(Task.Param.Frame))}}: print('openjd_output_var: X[%d]=%d' % (f, f * 10))
            print('openjd_output_var: X[1]=10')
