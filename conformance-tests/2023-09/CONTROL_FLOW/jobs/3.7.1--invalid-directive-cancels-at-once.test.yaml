# RFC 0011 §Processing a directive: the runtime MUST cancel the Action as soon as it reads
# an invalid directive, so the line printed after a 30 s sleep never appears. A runner
# should apply a timeout well under 30 s to catch a runtime that waits for exit.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import time
            print('openjd_output_var: V=not-json', flush=True)
            time.sleep(30)
            print('AFTER' + '_SLEEP')
expected:
  taskFailure: {}
  forbidden:
  - AFTER_SLEEP
