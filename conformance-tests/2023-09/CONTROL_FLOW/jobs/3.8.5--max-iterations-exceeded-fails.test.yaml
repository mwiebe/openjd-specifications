# RFC 0013 §The iteration boundary item 5 / Design Choice 5: a loop that would start iteration
# maxIterations fails, and the Steps after it never run. until becomes true at iteration 4, so
# a runtime that ignored the bound would print IT_3 and C_RAN and succeed instead of hanging.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      until: '{{Loop.Iteration >= 4}}'
      maxIterations: 3
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - IT_0
  - IT_1
  - IT_2
  forbidden:
  - IT_3
  - C_RAN
