# RFC 0011 §Task parameter ranges: a STRING range "{{Steps.P.Output.Keys}}" gives one Task
# per element of the producer's list.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: Keys
      type: LIST[STRING]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: Keys=["alpha", "beta", "gamma"]')
  - name: C
    dependencies:
    - dependsOn: P
    parameterSpace:
      taskParameterDefinitions:
      - name: Key
        type: STRING
        range: '{{Steps.P.Output.Keys}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('KEY:' + {{repr_py(Task.Param.Key)}})
expected:
  output:
  - KEY:alpha
  - KEY:beta
  - KEY:gamma
