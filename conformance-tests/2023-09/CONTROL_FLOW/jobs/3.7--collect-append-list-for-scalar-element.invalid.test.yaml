# RFC 0011 Type conversion table: LIST[FLOAT] with APPEND, E=[1] is invalid; each directive
# supplies one float.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[FLOAT]
      collect: APPEND
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=[1]')
