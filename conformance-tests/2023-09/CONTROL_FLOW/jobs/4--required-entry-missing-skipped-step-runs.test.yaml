# RFC 0011 §<Environment> item 3 and RFC 0010's Template Schemas §3.2 required and §3.2.1: an
# enabled entry with required: true whose name resolves to no Environment is rejected in the
# Step's Environment selection. Resolving the name stays at Job creation, but resolving to
# nothing is an error only in the Step's Environment selection. S's entry names Missing, which
# no Job Environment or attached Environment has, and S's enableIf is Param.Run.
#
# Run is false, so S is skipped and the Job runs.
# 4--required-entry-missing-enabled-step-fails-job-creation is the companion. D, which depends
# on S, runs, as it would not if S had failed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: Run
    type: BOOL
  steps:
  - name: T
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('T_' + 'RAN')
  - name: S
    enableIf: Param.Run
    dependencies:
    - environment: Missing
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('S_' + 'RAN')
  - name: D
    dependencies:
    - dependsOn: S
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('D_' + 'RAN')
parameters:
  Run: false
expected:
  output:
  - T_RAN
  - D_RAN
  forbidden:
  - S_RAN
