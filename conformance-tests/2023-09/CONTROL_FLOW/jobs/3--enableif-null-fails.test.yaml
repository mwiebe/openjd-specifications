# RFC 0011 §<StepTemplate> enableIf: an expression field of type bool. An expression of
# type bool? is accepted, but a null result (a skipped producer's output) is an error
# (RFC 0010's Template Schemas §7.6 rule 2) and fails instead of enabling the Step. Q is
# skipped at Job creation, so P's enableIf is decided then (§When groups are evaluated)
# and Job creation fails. 3--enableif-optional-type-runs is the valid companion.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: Q
    enableIf: false
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: Go=true')
  - name: P
    enableIf: 'Steps.Q.Output.Go'
    dependencies:
    - dependsOn: Q
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN')
expected:
  taskFailure: {}
  forbidden:
  - P_RAN
