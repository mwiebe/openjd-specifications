# RFC 0011 §Processing a directive, invalid item 11: a <TaskSelector> is not allowed in a
# Step without a CHUNK[INT] parameter.
# X is collect: LAST and gets a valid value first, so a runtime that ignored
# the line under test would let the run succeed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    parameterSpace:
      taskParameterDefinitions:
      - name: F
        type: INT
        range:
        - 1
    outputVariables:
    - name: X
      type: INT
      collect: LAST
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: X=1')
            print('openjd_output_var: X[{{Task.Param.F}}]=1')
