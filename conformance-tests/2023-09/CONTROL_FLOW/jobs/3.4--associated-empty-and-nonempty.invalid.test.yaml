# RFC 0010 §Empty parameter spaces: an empty range associated, as in (A, B), with a
# non-empty one is an error at binding.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: L
      type: LIST[INT]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: L=[]')
  - name: C
    dependencies:
    - dependsOn: P
    parameterSpace:
      taskParameterDefinitions:
      - name: A
        type: INT
        range: '{{Steps.P.Output.L}}'
      - name: B
        type: INT
        range:
        - 1
      combination: (A, B)
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_TAS' + 'K_RAN')
