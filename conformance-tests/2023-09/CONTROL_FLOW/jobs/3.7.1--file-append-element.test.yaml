# RFC 0011 §Collect modes: under APPEND, a <FilePath> value supplies one element, as an
# inline value does.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[LIST[INT]]
      collect: APPEND
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json
            with open('e.json', 'w') as f: json.dump([1, 2], f)
            print('openjd_output_var: V=@e.json')
            print('openjd_output_var: V=[]')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.V))}})))
expected:
  output:
  - GOT:[[1, 2], []]
