# RFC 0010 §What binding does item 1: a Step disabled at binding doesn't evaluate its let,
# so min() of an empty upstream list is never computed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: Q
    outputVariables:
    - name: Go
      type: BOOL
    - name: L
      type: LIST[INT]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: Go=false'); print('openjd_output_var: L=[]')
  - name: P
    enableIf: '{{Steps.Q.Output.Go}}'
    let:
    - m = min(Steps.Q.Output.L)
    dependencies:
    - dependsOn: Q
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print({{m}})
  - name: D
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('D_' + 'RAN')
expected:
  output:
  - D_RAN
