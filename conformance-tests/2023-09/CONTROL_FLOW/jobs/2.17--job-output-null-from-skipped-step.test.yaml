# RFC 0011 §Job outputs item 4: a skipped Step's symbols are null, and a null job output
# means no value, which is not an error. P's marker shows it really was skipped.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  jobOutputDefinitions:
  - name: Count
    type: INT
    value: '{{Steps.P.Output.N}}'
  steps:
  - name: P
    enableIf: false
    outputVariables:
    - name: N
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN'); print('openjd_output_var: N=3')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  output:
  - C_RAN
  forbidden:
  - P_RAN
