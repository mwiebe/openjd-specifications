# RFC 0013 §<LoopVariableDefinition> item 6 and §<LoopOutputVariableDefinition> item 6, with
# RFC 0012 §<OutputVariableDefinition> item 6 and Template Schemas §2.10: a RANGE_EXPR loop
# variable's or loop output's minLength and maxLength are checked against both its value as
# written, the string its format string resolves to, and its canonical form, and a violation
# fails the loop.
#
# The valid companion of 3.8.5--loop-output-range-expr-max-length-fails-loop and
# 3.8.5--loop-variable-range-expr-min-length-canonical-fails-loop. The variable R has minLength
# 3; its next value 1-3:{{Loop.Iteration + 2}} resolves to 1-3:2 at the boundary of iteration
# 0, whose canonical form 1,3 has 3 characters. The LAST output O has maxLength 5; its value
# 1,2,{{Loop.Iteration + 3}} resolves to 1,2,3 and then 1,2,4, 5 characters as written, with
# canonical forms 1-3 and 1,2,4 that also fit. So the loop runs two iterations and
# succeeds.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      variables:
      - name: R
        type: RANGE_EXPR
        initial: 1-10
        next: '1-3:{{Loop.Iteration + 2}}'
        minLength: 3
      until: Loop.Iteration >= 1
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
    outputVariables:
    - name: O
      type: RANGE_EXPR
      collect: LAST
      value: '1,2,{{Loop.Iteration + 3}}'
      maxLength: 5
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  output:
  - IT_0
  - IT_1
  - C_RAN
