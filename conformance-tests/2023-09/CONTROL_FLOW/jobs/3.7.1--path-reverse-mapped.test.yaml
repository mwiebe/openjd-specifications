# RFC 0011 §Path values: a worker PATH is stored in the submission path context (RawOutput,
# mapping source_path -> destination_path in reverse) and mapped forward again for the
# consumer (Output). Rule: /mnt/submit (submission) -> /worker/root (worker).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: F
      type: PATH
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: F="/worker/root/shot01/out.exr"')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('RAW:' + {{repr_py(Steps.P.RawOutput.F)}})
            print('MAPPED:' + {{repr_py(Steps.P.Output.F)}})
pathMapping:
- source_path_format: POSIX
  source_path: /mnt/submit
  destination_path: /worker/root
runOn:
- posix
expected:
  output:
  - RAW:/mnt/submit/shot01/out.exr
  - MAPPED:/worker/root/shot01/out.exr
