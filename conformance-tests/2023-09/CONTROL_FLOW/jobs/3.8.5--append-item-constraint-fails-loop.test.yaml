# RFC 0013 §<LoopOutputVariableDefinition> item 6: under APPEND, the item constraints are
# checked on each element as it is added, and a violation fails the loop at once. H's
# elements have maxValue 0, so the element from iteration 1 fails the loop.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      until: 'Loop.Iteration >= 4'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
    outputVariables:
    - name: H
      type: LIST[INT]
      collect: APPEND
      value: '{{Loop.Iteration}}'
      item:
        maxValue: 0
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - IT_0
  - IT_1
  forbidden:
  - IT_2
  - C_RAN
