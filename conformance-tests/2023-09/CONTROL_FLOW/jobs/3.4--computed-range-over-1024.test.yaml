# RFC 0011 §Range length: with CONTROL_FLOW, a range computed from Steps.* may have more
# than 1024 values. A single 1025-Task chunk keeps the run fast.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  - TASK_CHUNKING
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: N
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: N=1025')
  - name: C
    dependencies:
    - dependsOn: P
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: CHUNK[INT]
        range: '{{range(Steps.P.Output.N)}}'
        chunks:
          defaultTaskCount: 1025
          rangeConstraint: CONTIGUOUS
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('COUNT:' + str(len({{repr_py(list(Task.Param.Frame))}})))
expected:
  output:
  - COUNT:1025
