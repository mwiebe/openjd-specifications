# RFC 0011 §<Environment> item 3 and RFC 0010's Template Schemas §3.2 constraint 7: a Step's
# Environment selection checks constraint 7 for every Environment that applies to the Step,
# before any of their enableIf is evaluated. E is a BY_DEFAULT Job Environment whose Pkg has
# no default, so it applies to every Step that does not decline it.
#
# The companion of 4--constraint-7-at-binding-fails with P reporting Go=false: C is skipped at
# step input binding, so it has no Environment selection and the check is never made for it,
# and the Job succeeds.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: UseE
    type: BOOL
    default: false
  jobEnvironments:
  - name: E
    enableIf: Param.UseE
    envParameterDefinitions:
    - name: Pkg
      type: STRING
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('E_' + 'IN', '{{Env.Param.Pkg}}')
  steps:
  - name: P
    dependencies:
    - environment: E
      parameters:
        Pkg: p
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN'); print('openjd_output_var: Go=false')
  - name: C
    enableIf: Steps.P.Output.Go
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  output:
  - P_RAN
  forbidden:
  - C_RAN
