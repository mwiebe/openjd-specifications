# RFC 0013 §The iteration boundary item 1 and failure rule: a loop output value that fails to
# evaluate fails the loop at that boundary.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      until: '{{Loop.Iteration >= 4}}'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
    outputVariables:
    - name: X
      type: LIST[INT]
      collect: APPEND
      value: '{{fail(''bad value'') if Loop.Iteration == 1 else Loop.Iteration}}'
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - IT_0
  - IT_1
  forbidden:
  - IT_2
  - C_RAN
