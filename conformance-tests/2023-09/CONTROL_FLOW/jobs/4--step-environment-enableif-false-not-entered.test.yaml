# RFC 0011 §<Environment> items 1 and 4: a Step Environment's enableIf may read the Steps.*
# symbols of the Step's direct dependencies, and is evaluated with the Step's remaining group
# once Q's output is concrete. It is false, so CEnv is not entered and its variables are not
# set, but C's Tasks still run (RFC 0010's Template Schemas §4 item 6).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: Q
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: Go=false')
  - name: C
    dependencies:
    - dependsOn: Q
    stepEnvironments:
    - name: CEnv
      enableIf: Steps.Q.Output.Go
      script:
        actions:
          onEnter:
            command: python
            args:
            - -c
            - |-
              print('ENV_E' + 'NTERED')
      variables:
        CF_VAR: set
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import os; print('VAR:' + os.environ.get('CF_VAR', 'UNSET'))
expected:
  output:
  - VAR:UNSET
  forbidden:
  - ENV_ENTERED
