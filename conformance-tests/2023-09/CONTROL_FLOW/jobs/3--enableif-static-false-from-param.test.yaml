# RFC 0010 §Conditional execution: an enableIf over Param.* is decided at Job creation; a
# disabled Step satisfies its dependents' dependsOn.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: Run
    type: BOOL
    default: true
  steps:
  - name: S
    enableIf: '{{Param.Run}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('S_' + 'RAN')
  - name: T
    dependencies:
    - dependsOn: S
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('T_' + 'RAN')
parameters:
  Run: false
expected:
  output:
  - T_RAN
  forbidden:
  - S_RAN
