# RFC 0011 §<Environment> item 3 and RFC 0010's Template Schemas §4 item 6: a Job
# Environment's enableIf is decided per Step in the Step's Environment selection. S's enableIf
# reads P's output, so its Environment selection is made at step input binding, with the same
# Job Parameter value. E's enableIf is false, so neither P's nor S's Sessions enter E or set
# its variables. E's enableIf reads only a Job Parameter, so its result is the same whenever it
# is decided, and the test shows the result on the step-input-binding path, not when it is
# decided. 4--job-environment-enableif-true-entered is the companion.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: UseEnv
    type: BOOL
    default: false
  jobEnvironments:
  - name: E
    enableIf: Param.UseEnv
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('ENV_E' + 'NTERED')
    variables:
      CF_VAR: set
  steps:
  - name: P
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: Go=true')
  - name: S
    enableIf: Steps.P.Output.Go
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import os; print('VAR:' + os.environ.get('CF_VAR', 'UNSET'))
expected:
  output:
  - VAR:UNSET
  forbidden:
  - ENV_ENTERED
