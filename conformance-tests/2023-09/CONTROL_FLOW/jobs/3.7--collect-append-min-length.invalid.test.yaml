# RFC 0011 §Processing a directive: when the Action exits, every APPEND list must satisfy
# its minLength.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[INT]
      collect: APPEND
      minLength: 2
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1')
