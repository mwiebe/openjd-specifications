# RFC 0011 §Processing a directive step 4: each element of a LIST[PATH] value is
# reverse-mapped to the submission path context.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: F
      type: LIST[PATH]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: F=["/worker/root/a", "/worker/root/b"]')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('RAW:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.RawOutput.F))}})))
            import json; print('MAPPED:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.F))}})))
pathMapping:
- source_path_format: POSIX
  source_path: /mnt/submit
  destination_path: /worker/root
runOn:
- posix
expected:
  output:
  - RAW:["/mnt/submit/a", "/mnt/submit/b"]
  - MAPPED:["/worker/root/a", "/worker/root/b"]
