# RFC 0013 §<LoopVariableDefinition> item 6 and §<LoopOutputVariableDefinition> item 6, with
# RFC 0012 §<OutputVariableDefinition> item 6 and Template Schemas §2.10: a RANGE_EXPR loop
# variable's or loop output's minLength and maxLength are checked against both its value as
# written, the string its format string resolves to, and its canonical form, and a violation
# fails the loop.
#
# The variable R has minLength 4. Its initial value 1-10 has 4 characters and is its own
# canonical form. Its next value 1-3:{{Loop.Iteration + 2}} resolves to 1-3:2 at the boundary
# of iteration 0, 5 characters as written, whose canonical form 1,3 is 3, so that boundary
# fails the loop.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      variables:
      - name: R
        type: RANGE_EXPR
        initial: 1-10
        next: '1-3:{{Loop.Iteration + 2}}'
        minLength: 4
      until: Loop.Iteration >= 4
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - IT_0
  forbidden:
  - IT_1
  - C_RAN
