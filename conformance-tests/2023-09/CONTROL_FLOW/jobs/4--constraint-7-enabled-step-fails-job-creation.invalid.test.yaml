# RFC 0011 §<Environment> item 3 and RFC 0010's Template Schemas §3.2 constraint 7: a Step's
# Environment selection checks constraint 7 for every Environment that applies to the Step,
# before any of their enableIf is evaluated. E is a BY_DEFAULT Job Environment whose Pkg has
# no default, so it applies to every Step that does not decline it.
#
# The companion of 4--constraint-7-skipped-step-runs with Run true: S's enableIf is decided
# true at Job creation, so its Environment selection is made then, S supplies no value for
# Pkg, and Job creation fails.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: Run
    type: BOOL
  jobEnvironments:
  - name: E
    envParameterDefinitions:
    - name: Pkg
      type: STRING
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('E_' + 'IN', '{{Env.Param.Pkg}}')
  steps:
  - name: T
    dependencies:
    - environment: E
      parameters:
        Pkg: t
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('T_' + 'RAN')
  - name: S
    enableIf: Param.Run
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('S_' + 'RAN')
parameters:
  Run: true
