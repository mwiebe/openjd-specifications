# RFC 0010 Type conversion table: LIST[FLOAT], collect: APPEND, E=1 then E=2.5 gives
# [1.0, 2.5]. This proves only that an int element is accepted for a FLOAT element type
# with the right value: 1 + 0.25 is 1.25 whether the element is int or float, so the
# int-to-float conversion itself isn't observable here. Arithmetic avoids depending on how
# 1.0 is printed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: E
      type: LIST[FLOAT]
      collect: APPEND
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: E=1'); print('openjd_output_var: E=2.5')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json([x + 0.25 for x in Steps.P.Output.E]))}})))
expected:
  output:
  - GOT:[1.25, 2.75]
