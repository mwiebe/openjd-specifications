# RFC 0010 §Chunked Steps item 1: the selector must be a value in the chunk being run, and
# the check is against the chunk the runtime was given, not the parameter's whole range.
# Frames 1-4 run in two chunks of 2. Each chunk reports valid values for its own Tasks,
# then one value for a Task of the other chunk (a Frame that is in the range). X is
# collect: LAST, so a runtime that checked the selector against the whole range would
# accept every line and let the run succeed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  - TASK_CHUNKING
  name: TestJob
  steps:
  - name: P
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: CHUNK[INT]
        range: 1-4
        chunks:
          defaultTaskCount: 2
          rangeConstraint: CONTIGUOUS
    outputVariables:
    - name: X
      type: INT
      collect: LAST
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            fs = {{repr_py(list(Task.Param.Frame))}}
            for f in fs: print('openjd_output_var: X[%d]=%d' % (f, f * 10))
            other = [f for f in [1, 2, 3, 4] if f not in fs][0]
            print('openjd_output_var: X[%d]=%d' % (other, other * 10))
