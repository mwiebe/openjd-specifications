# RFC 0013 §Loop binding item 3: the companion of
# 3.8.5--error-in-initial-fails-job-creation, the same template with N = 2, so a runtime
# that rejects the template outright fails this test. The start group is evaluated at Job
# creation and the loop runs iterations 0 to 4.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: N
    type: INT
  steps:
  - name: X
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('X_' + 'RAN')
  - name: L
    loop:
      variables:
      - name: N
        type: INT
        initial: '{{Param.N if Param.N > 0 else fail(''N must be positive'')}}'
        next: '{{Loop.N + 1}}'
      until: '{{Loop.Iteration >= 4}}'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
parameters:
  N: 2
expected:
  output:
  - X_RAN
  - IT_0
  - IT_4
  - C_RAN
  forbidden:
  - IT_5
