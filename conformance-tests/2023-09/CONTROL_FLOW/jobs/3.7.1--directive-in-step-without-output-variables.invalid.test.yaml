# RFC 0010 §Which Actions may print it: in a CONTROL_FLOW Job, a directive from the onRun
# of a Step that declares no outputVariables is invalid.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: S
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1')
