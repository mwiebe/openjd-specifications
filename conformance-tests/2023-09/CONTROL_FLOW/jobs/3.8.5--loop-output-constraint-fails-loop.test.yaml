# RFC 0013 §<LoopOutputVariableDefinition> item 6 and §The iteration boundary: under LAST,
# each iteration's value is checked against the output's constraint properties, and a
# violation fails the loop at once. O is Loop.Iteration with maxValue 0, so the boundary of
# iteration 1 fails the loop.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      until: '{{Loop.Iteration >= 4}}'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
    outputVariables:
    - name: O
      type: INT
      collect: LAST
      value: '{{Loop.Iteration}}'
      maxValue: 0
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - IT_0
  - IT_1
  forbidden:
  - IT_2
  - C_RAN
