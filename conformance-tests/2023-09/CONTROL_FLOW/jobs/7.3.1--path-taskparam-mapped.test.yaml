# RFC 0010 §The Steps.* scope: Steps.P.TaskParam of a PATH Task parameter has the consuming
# Session's rules applied; TaskRawParam is unmapped.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    parameterSpace:
      taskParameterDefinitions:
      - name: F
        type: PATH
        range:
        - /mnt/submit/a
        - /mnt/submit/b
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print()
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('RAW:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.TaskRawParam.F))}})))
            import json; print('MAPPED:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.TaskParam.F))}})))
pathMapping:
- source_path_format: POSIX
  source_path: /mnt/submit
  destination_path: /worker/root
runOn:
- posix
expected:
  output:
  - RAW:["/mnt/submit/a", "/mnt/submit/b"]
  - MAPPED:["/worker/root/a", "/worker/root/b"]
