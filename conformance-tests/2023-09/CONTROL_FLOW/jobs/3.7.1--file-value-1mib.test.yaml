# RFC 0011 §Limits item 2: a runtime MUST accept at least 1 MiB of output values per Task;
# this @ file is 1,000,002 bytes.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: STRING
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json
            with open('big.json', 'w') as f: json.dump('a' * 1000000, f)
            print('openjd_output_var: V=@big.json')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(len(Steps.P.Output.V)))}})))
expected:
  output:
  - GOT:1000000
