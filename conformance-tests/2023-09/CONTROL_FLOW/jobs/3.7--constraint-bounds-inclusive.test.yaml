# RFC 0010 §<OutputVariableDefinition> item 6: constraints have the job parameter meaning,
# so minValue/maxValue are inclusive and a value at the bound is accepted.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
      minValue: 1
      maxValue: 10
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=10')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.V))}})))
expected:
  output:
  - GOT:10
