# RFC 0013 §<LoopVariableDefinition> items 4 and 6 and §The iteration boundary item 3: a while
# loop evaluates next at its final boundary, before while, so a constraint violation there fails
# the loop even though while would have ended it (N = 3 after iteration 2, maxValue 2).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      variables:
      - name: N
        type: INT
        initial: '{{0}}'
        next: '{{Loop.N + 1}}'
        maxValue: 2
      while: 'Loop.Iteration < 3'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - IT_0
  - IT_1
  - IT_2
  forbidden:
  - IT_3
  - C_RAN
