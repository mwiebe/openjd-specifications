# RFC 0011 §Job outputs item 4: a Step with zero Tasks gives empty lists, so
# min(Steps.P.Output.X) fails the Job.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  jobOutputDefinitions:
  - name: Best
    type: INT
    value: '{{min(Steps.P.Output.X)}}'
  steps:
  - name: Q
    outputVariables:
    - name: L
      type: LIST[INT]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: L=[]')
  - name: P
    dependencies:
    - dependsOn: Q
    parameterSpace:
      taskParameterDefinitions:
      - name: F
        type: INT
        range: '{{Steps.Q.Output.L}}'
    outputVariables:
    - name: X
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: X=1')
