# RFC 0011 §Extension name and dependencies and RFC 0010's Template Schemas §1.2 item 3 and
# §4 item 6: an Environment's enableIf requires ENV_PARAMS in the document that has it, and
# extensions are per document, so a Job Template's ENV_PARAMS and CONTROL_FLOW don't make
# enableIf available to an Environment Template that lists only EXPR. The Environment
# Template's enableIf is true, so a runtime that allowed it would enter the Environment and
# run the Steps. The submission is rejected before anything runs; expected.taskFailure is used
# because the runner ignores forbidden markers in .invalid tests.
# 4--environment-template-in-control-flow-job-runs is the companion without enableIf.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: N
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN'); print('openjd_output_var: N=1')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN', {{Steps.P.Output.N}})
environments:
- specificationVersion: environment-2023-09
  extensions:
  - EXPR
  environment:
    name: EnvTemplate
    enableIf: true
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('E_' + 'RAN')
        onExit:
          command: python
          args:
          - -c
          - |-
            print('X_' + 'EXIT')
expected:
  taskFailure: {}
  forbidden:
  - E_RAN
  - P_RAN
  - C_RAN
