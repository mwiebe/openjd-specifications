# RFC 0010 §When groups are evaluated: at Job creation, for a Step whose enableIf is absent,
# every materialization group whose inputs are concrete MUST be evaluated, and a failure
# fails Job creation. C's range reads only a job parameter and fails, while its let (used by
# its remaining group, which uses every let) waits for P. Job creation fails, so no Step runs:
# an implementation that waited for all of C's inputs would run P first and print its marker.
# The run fails at Job creation, not in a Task; expected.taskFailure is used anyway because
# the runner ignores forbidden markers in .invalid tests. 7.4--pending-step-static-range-runs
# is the same template with a valid N, so a runtime that rejects the template outright fails
# that test.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: N
    type: INT
    default: 0
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN'); print('openjd_output_var: V=1')
  - name: C
    let:
    - v = Steps.P.Output.V
    dependencies:
    - dependsOn: P
    parameterSpace:
      taskParameterDefinitions:
      - name: F
        type: INT
        range: '{{range(Param.N) if Param.N > 0 else fail(''N must be positive'')}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_TAS' + 'K_RAN', {{v}})
expected:
  taskFailure: {}
  forbidden:
  - P_RAN
  - C_TASK_RAN
