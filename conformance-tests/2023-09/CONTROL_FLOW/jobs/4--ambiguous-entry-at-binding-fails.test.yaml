# RFC 0011 §<Environment> item 3 and RFC 0010's Template Schemas §3.2.1 item 3: an enabled
# entry whose name two or more attached Environments share is rejected in the Step's
# Environment selection. C's enableIf reads P's output, so its Environment selection is made at
# step input binding.
#
# C's enabled entry names Conda, which two attached Environment Templates share, so C fails
# before any of its Tasks runs. 4--ambiguous-entry-skipped-step-runs is the companion.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN'); print('openjd_output_var: Go=true')
  - name: C
    enableIf: Steps.P.Output.Go
    dependencies:
    - dependsOn: P
    - environment: Conda
      required: false
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
environments:
- specificationVersion: environment-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  environment:
    name: Conda
    activation: ON_REQUEST
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('C1_' + 'IN')
- specificationVersion: environment-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  environment:
    name: Conda
    activation: ON_REQUEST
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('C2_' + 'IN')
expected:
  taskFailure: {}
  output:
  - P_RAN
  forbidden:
  - C_RAN
  - C1_IN
  - C2_IN
