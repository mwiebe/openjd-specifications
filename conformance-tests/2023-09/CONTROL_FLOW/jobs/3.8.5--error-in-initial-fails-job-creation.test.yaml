# RFC 0013 §Loop binding item 3 and §Failure: an error in an initial fails the loop, and
# fails Job creation when the start group is evaluated then. N's initial reads only a job
# parameter, so with N = 0 its fail(...) fails Job creation before X, which is independent
# of L, runs. The run fails at Job creation, not in a Task; expected.taskFailure is used
# anyway because the runner ignores forbidden markers in .invalid tests.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: N
    type: INT
  steps:
  - name: X
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('X_' + 'RAN')
  - name: L
    loop:
      variables:
      - name: N
        type: INT
        initial: '{{Param.N if Param.N > 0 else fail(''N must be positive'')}}'
        next: '{{Loop.N + 1}}'
      until: 'Loop.Iteration >= 4'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
parameters:
  N: 0
expected:
  taskFailure: {}
  forbidden:
  - X_RAN
  - IT_0
  - C_RAN
