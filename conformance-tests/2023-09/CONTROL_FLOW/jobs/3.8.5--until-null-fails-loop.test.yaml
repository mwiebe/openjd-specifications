# RFC 0013 §The iteration boundary: a null result of until (RFC 0013 §<LoopDefinition> item
# 3) fails the loop at once at the boundary where it is evaluated (after iteration 1), so no
# later iteration starts and C never runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      until: 'null if Loop.Iteration == 1 else Loop.Iteration >= 4'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - IT_0
  - IT_1
  forbidden:
  - IT_2
  - C_RAN
