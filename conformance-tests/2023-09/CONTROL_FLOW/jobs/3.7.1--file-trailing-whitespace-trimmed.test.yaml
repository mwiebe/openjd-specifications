# RFC 0010 §The openjd_output_var directive: <FilePath> is the rest of the line after '@'
# with trailing spaces and tabs removed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[STRING]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json
            with open('v.json', 'w') as f: json.dump(['alpha'], f)
            print('openjd_output_var: V=@v.json \t ')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.V))}})))
expected:
  output:
  - GOT:["alpha"]
