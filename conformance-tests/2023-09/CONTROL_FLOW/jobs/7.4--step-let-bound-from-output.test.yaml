# RFC 0011 §Materialization groups: a step-level let that reads Steps.* is evaluated at binding.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: N
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: N=21')
  - name: C
    let:
    - n2 = Steps.P.Output.N * 2
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(n2))}})))
expected:
  output:
  - GOT:42
