# RFC 0011 §Type conversion: nesting deeper than the target type is an error; LIST[INT]
# L=[[1]] is invalid.
# V is collect: LAST and gets a valid value first, so a runtime that ignored
# the line under test would let the run succeed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[INT]
      collect: LAST
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=[1]')
            print('openjd_output_var: V=[[1]]')
