# RFC 0011 §Processing a directive, Type conversion table: FLOAT X=3 gives 3.0. This proves
# only that a JSON integer is accepted for a FLOAT output and has the right value: 3 + 0.5
# is 3.5 whether V is int or float, so the int-to-float conversion itself isn't observable
# here. Arithmetic avoids depending on how an integral float is printed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: FLOAT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=3')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.V + 0.5))}})))
expected:
  output:
  - GOT:3.5
