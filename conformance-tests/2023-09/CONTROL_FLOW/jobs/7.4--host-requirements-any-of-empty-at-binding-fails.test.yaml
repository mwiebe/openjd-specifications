# RFC 0011 §<Environment> item 5 and Template Schemas §3.3 item 3: with ENV_PARAMS, an anyOf
# written as one expression whose result is an empty list is an error, and with CONTROL_FLOW
# the rule applies when the Step's hostRequirements are evaluated at step input binding,
# failing only that Step. P reports the empty list L, and C's anyOf is L, so C fails before
# any of its Tasks runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: L
      type: LIST[STRING]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN'); print('openjd_output_var: L=[]')
  - name: C
    dependencies:
    - dependsOn: P
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: '{{Steps.P.Output.L}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - P_RAN
  forbidden:
  - C_RAN
