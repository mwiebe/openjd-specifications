# RFC 0011 §<Environment> item 3 and RFC 0010's Template Schemas §3.2 enableIf and §4 item 4: a
# disabled entry for an Environment whose activation is ALWAYS as written in its document is
# an error, found in the Step's Environment selection. C's enableIf reads P's output, so its
# Environment selection is made at step input binding.
#
# Lic is the Environment of an attached Environment Template that lists ENV_PARAMS and has
# activation ALWAYS, so C's disabled entry for it is an error and C fails before any of its
# Tasks runs. 4--pre-extension-environment-disabled-entry-at-binding-entered is the companion
# whose Environment Template does not list ENV_PARAMS.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN'); print('openjd_output_var: Go=true')
  - name: C
    enableIf: Steps.P.Output.Go
    dependencies:
    - dependsOn: P
    - environment: Lic
      enableIf: false
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
environments:
- specificationVersion: environment-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  environment:
    name: Lic
    activation: ALWAYS
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('L_' + 'IN')
    variables:
      CF_LIC: set
expected:
  taskFailure: {}
  output:
  - P_RAN
  forbidden:
  - C_RAN
