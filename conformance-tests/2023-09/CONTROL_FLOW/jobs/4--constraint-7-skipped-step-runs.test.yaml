# RFC 0011 §<Environment> item 3 and RFC 0010's Template Schemas §3.2 constraint 7: a Step's
# Environment selection checks constraint 7 for every Environment that applies to the Step,
# before any of their enableIf is evaluated. E is a BY_DEFAULT Job Environment whose Pkg has
# no default, so it applies to every Step that does not decline it.
#
# S supplies no value for Pkg, but its enableIf is Param.Run, which is false, so S is skipped
# at Job creation and has no Environment selection, and the check is never made for it. T
# supplies Pkg, so the Job runs. 4--constraint-7-enabled-step-fails-job-creation is the
# companion; job_templates/4--not-known-enabled-param checks a template like this one.
# D, which depends on S, runs, as it would not if S had failed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: Run
    type: BOOL
  jobEnvironments:
  - name: E
    envParameterDefinitions:
    - name: Pkg
      type: STRING
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('E_' + 'IN', '{{Env.Param.Pkg}}')
  steps:
  - name: T
    dependencies:
    - environment: E
      parameters:
        Pkg: t
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('T_' + 'RAN')
  - name: S
    enableIf: Param.Run
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('S_' + 'RAN')
  - name: D
    dependencies:
    - dependsOn: S
    - environment: E
      parameters:
        Pkg: d
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('D_' + 'RAN')
parameters:
  Run: false
expected:
  output:
  - E_IN t
  - T_RAN
  - D_RAN
  forbidden:
  - S_RAN
