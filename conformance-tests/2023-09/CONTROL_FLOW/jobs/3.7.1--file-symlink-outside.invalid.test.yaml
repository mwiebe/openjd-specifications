# RFC 0011 §File values item 2: the file must be inside the Working Directory after
# following symbolic links; a link inside it to a file outside is invalid.
# V is collect: LAST and gets a valid value first, so a runtime that ignored
# the line under test would let the run succeed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
      collect: LAST
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1')
            import os, tempfile
            fd, p = tempfile.mkstemp(suffix='.json')
            os.write(fd, b'1')
            os.close(fd)
            os.symlink(p, 'link.json')
            print('openjd_output_var: V=@' + 'link.json')
runOn:
- posix
