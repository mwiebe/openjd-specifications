# RFC 0011 §Processing a directive, invalid item 1: text after openjd_output_var: that
# doesn't match <Directive> (here, no '=') is invalid.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1'); print('openjd_output_var: V')
