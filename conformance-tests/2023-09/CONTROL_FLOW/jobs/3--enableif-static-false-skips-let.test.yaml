# RFC 0010 §What binding does item 1: if enableIf is false nothing after it is evaluated,
# so a disabled Step's let may assume the Step runs (here it would call fail()).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: N
    type: INT
    default: 1
  steps:
  - name: S
    enableIf: '{{Param.N > 5}}'
    let:
    - x = fail('let evaluated') if Param.N < 5 else 0
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print({{x}})
  - name: T
    dependencies:
    - dependsOn: S
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('T_' + 'RAN')
expected:
  output:
  - T_RAN
