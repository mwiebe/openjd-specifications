# RFC 0012 §<OutputVariableDefinition> item 6, with Template Schemas §2.10: a RANGE_EXPR
# output's minLength and maxLength are checked against both the value as reported and its
# canonical form, the rule for a RANGE_EXPR Job Parameter in a document that lists ENV_PARAMS.
#
# The companion of 3.7--range-expr-max-length-as-reported and
# 3.7--range-expr-min-length-canonical: V has minLength 3 and maxLength 3, and the Task
# reports 1-3, which is its own canonical form and 3 characters, so it is accepted.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: RANGE_EXPR
      minLength: 3
      maxLength: 3
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V="1-3"')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(string(Steps.P.Output.V)))}})))
expected:
  output:
  - GOT:"1-3"
