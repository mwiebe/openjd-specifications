# RFC 0013 §The iteration boundary items 4 and 5: while is checked before the bound, so a while
# loop whose condition turns false at the boundary of its last allowed iteration succeeds.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      while: 'Loop.Iteration < 3'
      maxIterations: 3
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  output:
  - IT_0
  - IT_1
  - IT_2
  - C_RAN
  forbidden:
  - IT_3
