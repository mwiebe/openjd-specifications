# RFC 0010 §Terminology, Producer: a Step with a parameterSpace and no outputVariables
# still provides Steps.P.TaskParam.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    parameterSpace:
      taskParameterDefinitions:
      - name: Key
        type: STRING
        range:
        - alpha
        - beta
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print()
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.TaskParam.Key))}})))
expected:
  output:
  - GOT:["alpha", "beta"]
