# RFC 0013 §<LoopVariableDefinition> item 6: a value from next that violates the variable's
# constraint properties fails the loop (N = 3 after iteration 2, maxValue 2).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      variables:
      - name: N
        type: INT
        initial: '{{0}}'
        next: '{{Loop.N + 1}}'
        maxValue: 2
      until: '{{Loop.Iteration >= 4}}'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - IT_0
  - IT_1
  - IT_2
  forbidden:
  - IT_3
  - C_RAN
