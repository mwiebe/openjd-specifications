# RFC 0011 §Conditional execution: a dynamic enableIf that is true runs the Step, and its
# outputs reach its dependents.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: Q
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: Go=true')
  - name: P
    enableIf: '{{Steps.Q.Output.Go}}'
    dependencies:
    - dependsOn: Q
    outputVariables:
    - name: X
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN'); print('openjd_output_var: X=9')
  - name: D
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.X or 0))}})))
expected:
  output:
  - P_RAN
  - GOT:9
