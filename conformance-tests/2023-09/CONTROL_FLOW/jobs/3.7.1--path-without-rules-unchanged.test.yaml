# RFC 0010 §Path values: with no path mapping rules, an absolute value is stored unchanged.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: F
      type: PATH
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: F="/elsewhere/a.exr"')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('RAW:' + {{repr_py(Steps.P.RawOutput.F)}})
            print('MAPPED:' + {{repr_py(Steps.P.Output.F)}})
runOn:
- posix
expected:
  output:
  - RAW:/elsewhere/a.exr
  - MAPPED:/elsewhere/a.exr
