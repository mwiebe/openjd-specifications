# RFC 0011 §File values item 4: the file holds one UTF-8 JSON value, optionally preceded by
# a byte order mark and surrounded by whitespace, and may span lines.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[STRING]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json
            with open('v.json', 'w', encoding='utf-8') as f:
                f.write('\ufeff\n' + json.dumps(['alpha', 'beta'], indent=2) + '\n\n')
            print('openjd_output_var: V=@v.json')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.V))}})))
expected:
  output:
  - GOT:["alpha", "beta"]
