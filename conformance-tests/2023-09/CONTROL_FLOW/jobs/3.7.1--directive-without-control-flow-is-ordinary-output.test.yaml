# RFC 0011 §The openjd_output_var directive: in a Session of a Job whose template does not
# list CONTROL_FLOW, the line is ordinary output. S prints it, and T, which runs only after
# S succeeded, prints a marker built at run time.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: S
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: ' + 'V=' + str(1))
  - name: T
    dependencies:
    - dependsOn: S
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('T_' + 'RAN')
expected:
  output:
  - 'openjd_output_var: V=1'
  - T_RAN
