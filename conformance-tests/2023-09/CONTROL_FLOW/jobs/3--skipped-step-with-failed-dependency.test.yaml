# RFC 0010 §Conditional execution, Failure is not skipping: a Step that is SKIPPED but one
# of whose own dependencies fails never satisfies dependsOn. Its null symbols are concrete,
# so C may be bound with them (its let reads one), but C stays blocked behind A's failure.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import sys; sys.exit(3)
  - name: B
    enableIf: false
    dependencies:
    - dependsOn: A
    outputVariables:
    - name: N
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('B_' + 'RAN'); print('openjd_output_var: N=1')
  - name: C
    let:
    - n = Steps.B.Output.N or 0
    dependencies:
    - dependsOn: B
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN', {{n}})
expected:
  taskFailure:
    exitCode: 3
  forbidden:
  - B_RAN
  - C_RAN
