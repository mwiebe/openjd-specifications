# RFC 0013 §Loop binding item 3 and §<LoopVariableDefinition> item 6: an initial value is
# checked against the variable's constraint properties. N's initial is 1 from the loop's
# dependency, over maxValue 0, so the loop fails at loop binding before iteration 0 starts.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1'); print('P_' + 'RAN')
  - name: L
    dependencies:
    - dependsOn: P
    loop:
      variables:
      - name: N
        type: INT
        initial: '{{Steps.P.Output.V}}'
        next: '{{Loop.N + 1}}'
        maxValue: 0
      until: 'Loop.Iteration >= 4'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - P_RAN
  forbidden:
  - IT_0
  - C_RAN
