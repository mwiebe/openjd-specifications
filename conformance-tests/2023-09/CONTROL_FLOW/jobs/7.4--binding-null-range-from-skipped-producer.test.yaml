# RFC 0010 §How a Step is bound item 3 / Design Choice 8: a skipped producer's null where a
# value is required (a range) fails the consumer; none of its Tasks runs. P is skipped at Job
# creation, so its null is concrete then and C's range is evaluated then (§When groups are
# evaluated), which fails Job creation; either way the run fails.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    enableIf: false
    outputVariables:
    - name: L
      type: LIST[INT]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: L=[1]')
  - name: C
    dependencies:
    - dependsOn: P
    parameterSpace:
      taskParameterDefinitions:
      - name: F
        type: INT
        range: '{{Steps.P.Output.L}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_TAS' + 'K_RAN')
expected:
  taskFailure: {}
  forbidden:
  - C_TASK_RAN
