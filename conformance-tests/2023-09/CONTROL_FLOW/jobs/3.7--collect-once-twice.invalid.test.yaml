# RFC 0010 §Collect modes: under ONCE (the default) a second directive is invalid, even
# with the same value.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1'); print('openjd_output_var: V=1')
