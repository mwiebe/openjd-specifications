# RFC 0011 §<Environment> item 3 and RFC 0010's Template Schemas §4 item 6: a Job
# Environment's enableIf is decided per Step in the Step's Environment selection. S's enableIf
# reads P's output, so its Environment selection is made at step input binding. E's enableIf
# is true, so S's Sessions enter E and set its variables.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: UseEnv
    type: BOOL
    default: false
  jobEnvironments:
  - name: E
    enableIf: Param.UseEnv
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('ENV_E' + 'NTERED')
    variables:
      CF_VAR: set
  steps:
  - name: P
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: Go=true')
  - name: S
    enableIf: Steps.P.Output.Go
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import os; print('VAR:' + os.environ.get('CF_VAR', 'UNSET'))
parameters:
  UseEnv: true
expected:
  output:
  - ENV_ENTERED
  - VAR:set
