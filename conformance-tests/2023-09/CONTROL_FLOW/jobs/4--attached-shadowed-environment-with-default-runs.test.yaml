# RFC 0011 §<Environment> item 3 ("What stays at Job creation" bullet) and RFC 0010's Template
# Schemas §3.2.1 item 4: an attached BY_DEFAULT or ALWAYS Environment with the name of a Job
# Environment is not reachable by name, so no entry can supply its parameters, and a parameter
# without a default rejects the submission whatever any Step's enableIf. The Job Template has
# the Job Environment Conda, and the attached Environment Template's BY_DEFAULT Environment is
# also named Conda.
#
# The companion of 4--attached-shadowed-environment-required-param-skipped-step: Pkg has a
# default, so the attached Environment applies to every Step without an error, and T, which
# has no enableIf, runs in it.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  jobEnvironments:
  - name: Conda
    variables:
      CF_CONDA: '1'
  steps:
  - name: T
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('T_' + 'RAN')
environments:
- specificationVersion: environment-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  environment:
    name: Conda
    envParameterDefinitions:
    - name: Pkg
      type: STRING
      default: x
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('A_' + 'IN', '{{Env.Param.Pkg}}')
expected:
  output:
  - A_IN x
  - T_RAN
