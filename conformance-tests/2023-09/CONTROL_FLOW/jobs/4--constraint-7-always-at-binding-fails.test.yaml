# RFC 0011 §<Environment> item 3 and RFC 0010's Template Schemas §3.2 constraint 7: a Step's
# Environment selection checks constraint 7 for every Environment that applies to the Step,
# before any of their enableIf is evaluated.
# E is an ALWAYS Job Environment whose Pkg has no default, so it applies to every Step. C's
# enableIf reads P's output, so its Environment selection is made at step input binding, and
# C supplies no value for Pkg, so C fails before any of its Tasks runs.
# 4--constraint-7-always-at-binding-skipped-step-runs is the companion.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - ENV_PARAMS
  - CONTROL_FLOW
  name: TestJob
  jobEnvironments:
  - name: E
    activation: ALWAYS
    envParameterDefinitions:
    - name: Pkg
      type: STRING
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |-
            print('E_' + 'IN', '{{Env.Param.Pkg}}')
  steps:
  - name: P
    dependencies:
    - environment: E
      parameters:
        Pkg: p
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN'); print('openjd_output_var: Go=true')
  - name: C
    enableIf: Steps.P.Output.Go
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - P_RAN
  forbidden:
  - C_RAN
