# RFC 0013 §<LoopOutputVariableDefinition> item 6 and §The iteration boundary item 4: an
# APPEND output's minLength is checked when while ends the loop, before it succeeds. H has
# minLength 3, and while ends the loop after two iterations with two elements, so the loop
# fails and C never runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: L
    loop:
      while: '{{Loop.Iteration < 2}}'
      maxIterations: 10
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
    outputVariables:
    - name: H
      type: LIST[INT]
      collect: APPEND
      value: '{{Loop.Iteration}}'
      minLength: 3
  - name: C
    dependencies:
    - dependsOn: L
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  taskFailure: {}
  output:
  - IT_0
  - IT_1
  forbidden:
  - IT_2
  - C_RAN
