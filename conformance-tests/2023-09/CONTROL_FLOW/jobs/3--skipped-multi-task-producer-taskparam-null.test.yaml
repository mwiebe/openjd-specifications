# RFC 0011 §Conditional execution: a skipped Step's Steps.*.TaskParam symbols are null too.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    enableIf: false
    parameterSpace:
      taskParameterDefinitions:
      - name: F
        type: INT
        range:
        - 1
        - 2
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.TaskParam.F == null))}})))
expected:
  output:
  - GOT:true
  forbidden:
  - P_RAN
