# RFC 0010 §The openjd_output_var directive: names are matched case-sensitively, so 'v'
# is an undeclared output of a Step that declares 'V'.
# V is collect: LAST, so a runtime that matched names case-insensitively would take
# 'v=1' as a second, valid value of V and let the run succeed, rather than fail it as a
# duplicate.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
      collect: LAST
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1'); print('openjd_output_var: v=1')
