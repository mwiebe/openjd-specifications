# RFC 0011 §Job outputs: job outputs that evaluate successfully (at creation and after a
# Step) don't affect a successful run.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: Label
    type: STRING
    default: x
  jobOutputDefinitions:
  - name: Label
    type: STRING
    value: '{{Param.Label}}'
  - name: Count
    type: INT
    value: '{{Steps.P.Output.N}}'
    minValue: 0
  steps:
  - name: P
    outputVariables:
    - name: N
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: N=3')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_' + 'RAN')
expected:
  output:
  - C_RAN
