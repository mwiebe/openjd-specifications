# RFC 0010 §Job outputs item 3: a job output evaluated at Job creation that fails (here a
# fail() over a parameter) makes Job creation fail.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  parameterDefinitions:
  - name: N
    type: INT
    default: 0
  jobOutputDefinitions:
  - name: Checked
    type: INT
    value: '{{Param.N if Param.N > 0 else fail(''N must be positive'')}}'
  steps:
  - name: S
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print()
