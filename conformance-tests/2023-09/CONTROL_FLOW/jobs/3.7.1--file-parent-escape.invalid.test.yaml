# RFC 0010 §File values item 2: a relative path that escapes the Working Directory with
# '..' is invalid.
# V is collect: LAST and gets a valid value first, so a runtime that ignored
# the line under test would let the run succeed. POSIX only: on Windows the temp
# directory may be on another drive, where no relative path reaches it.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
      collect: LAST
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1')
            import os, tempfile
            fd, p = tempfile.mkstemp(suffix='.json')
            os.write(fd, b'1')
            os.close(fd)
            print('openjd_output_var: V=@' + os.path.relpath(p))
runOn:
- posix
