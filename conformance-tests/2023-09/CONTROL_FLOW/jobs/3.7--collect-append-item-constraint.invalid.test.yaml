# RFC 0010 §Processing a directive step 5: under APPEND, the item constraints are checked
# on each new element.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[INT]
      collect: APPEND
      item:
        maxValue: 5
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1'); print('openjd_output_var: V=9')
