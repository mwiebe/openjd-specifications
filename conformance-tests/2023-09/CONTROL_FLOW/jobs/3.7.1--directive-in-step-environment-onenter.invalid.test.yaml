# RFC 0010 §Which Actions may print it: a directive from a Step Environment's onEnter is
# invalid, even in a Step that declares outputVariables.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    stepEnvironments:
    - name: SEnv
      script:
        actions:
          onEnter:
            command: python
            args:
            - -c
            - |-
              print('openjd_output_var: V=1')
    outputVariables:
    - name: V
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1')
