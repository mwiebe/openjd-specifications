# RFC 0010 §File values item 2: a symbolic link that resolves to a regular file inside the
# Working Directory is valid.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: LIST[STRING]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json, os
            with open('real.json', 'w') as f: json.dump(['alpha'], f)
            os.symlink('real.json', 'link.json')
            print('openjd_output_var: V=@link.json')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.V))}})))
runOn:
- posix
expected:
  output:
  - GOT:["alpha"]
