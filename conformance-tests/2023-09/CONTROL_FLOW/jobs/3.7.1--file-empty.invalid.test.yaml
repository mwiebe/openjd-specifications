# RFC 0010 §File values item 4: an empty file holds no JSON value.
# V is collect: LAST and gets a valid value first, so a runtime that ignored
# the line under test would let the run succeed.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
      collect: LAST
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1')
            open('v.json', 'w').close()
            print('openjd_output_var: V=@' + 'v.json')
