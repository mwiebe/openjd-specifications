# RFC 0011 §Conditional execution: an enableIf over Steps.* is decided at binding; false
# skips the Step and its dependent still runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: Q
    outputVariables:
    - name: Go
      type: BOOL
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: Go=false')
  - name: P
    enableIf: '{{Steps.Q.Output.Go}}'
    dependencies:
    - dependsOn: Q
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('P_' + 'RAN')
  - name: D
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('D_' + 'RAN')
expected:
  output:
  - D_RAN
  forbidden:
  - P_RAN
