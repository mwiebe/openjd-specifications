# RFC 0010 §<OutputVariableDefinition> item 6: only declared constraints are checked; the
# 1024-character default maxLength of a RANGE_EXPR parameter does not apply.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: RANGE_EXPR
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V="' + ','.join(str(i) for i in range(0, 4000, 2)) + '"')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('GOT:' + json.dumps(json.loads({{repr_py(repr_json(len(Steps.P.Output.V)))}})))
expected:
  output:
  - GOT:2000
