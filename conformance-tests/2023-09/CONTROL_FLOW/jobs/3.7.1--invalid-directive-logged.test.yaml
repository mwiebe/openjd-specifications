# RFC 0010 §The openjd_output_var directive: an invalid directive always stays in the log
# (with the error) and fails the Task.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=' + 'x' * 3)
expected:
  output:
  - 'openjd_output_var: V=xxx'
  taskFailure: {}
