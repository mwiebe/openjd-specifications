# RFC 0010 §Reductions item 1: the order is the parameter-space iteration order, which
# for a literal INT list is the order written, not sorted order.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    parameterSpace:
      taskParameterDefinitions:
      - name: F
        type: INT
        range:
        - 5
        - 1
        - 3
        - 2
    outputVariables:
    - name: X
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: X={{Task.Param.F * 10}}')
  - name: C
    dependencies:
    - dependsOn: P
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            import json; print('OUT:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.Output.X))}})))
            import json; print('TP:' + json.dumps(json.loads({{repr_py(repr_json(Steps.P.TaskParam.F))}})))
expected:
  output:
  - OUT:[50, 10, 30, 20]
  - TP:[5, 1, 3, 2]
