# RFC 0011 §Empty parameter spaces: associated empty ranges give an empty space, a
# zero-Task success.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: L
      type: LIST[INT]
    - name: K
      type: LIST[STRING]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: L=[]'); print('openjd_output_var: K=[]')
  - name: C
    dependencies:
    - dependsOn: P
    parameterSpace:
      taskParameterDefinitions:
      - name: A
        type: INT
        range: '{{Steps.P.Output.L}}'
      - name: B
        type: STRING
        range: '{{Steps.P.Output.K}}'
      combination: (A, B)
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('C_TAS' + 'K_RAN')
  - name: D
    dependencies:
    - dependsOn: C
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('D_' + 'RAN')
expected:
  output:
  - D_RAN
  forbidden:
  - C_TASK_RAN
