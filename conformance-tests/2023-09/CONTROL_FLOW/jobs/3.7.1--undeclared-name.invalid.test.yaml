# RFC 0010 §Processing a directive, invalid item 2: a directive naming an output the Step
# does not declare is invalid (V is reported correctly too).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  steps:
  - name: P
    outputVariables:
    - name: V
      type: INT
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |-
            print('openjd_output_var: V=1'); print('openjd_output_var: W=1')
