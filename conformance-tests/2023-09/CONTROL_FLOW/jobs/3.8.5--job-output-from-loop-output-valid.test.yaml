# RFC 0013 §Steps.* in and around a loop item 4 / RFC 0011 §Job outputs: a job output that
# reads a loop output is evaluated when the loop succeeds; a valid one does not affect the run.
# Its `fail` condition (`Final == 7`) is false. 3.8.5--job-output-from-loop-output-fails is the
# same template with a `fail` condition (`Final == 2`) that is true.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - CONTROL_FLOW
  name: TestJob
  jobOutputDefinitions:
  - name: Final
    type: INT
    value: '{{fail(''final is '' + string(Steps.L.Output.Final)) if Steps.L.Output.Final == 7 else Steps.L.Output.Final}}'
  steps:
  - name: L
    loop:
      until: 'Loop.Iteration >= 2'
      maxIterations: 5
      steps:
      - name: W
        script:
          actions:
            onRun:
              command: python
              args:
              - -c
              - |-
                print('IT' + '_' + str({{Loop.Iteration}}))
    outputVariables:
    - name: Final
      type: INT
      collect: LAST
      value: '{{Loop.Iteration}}'
expected:
  output:
  - IT_2
